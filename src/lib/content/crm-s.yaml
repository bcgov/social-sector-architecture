# SaaS CRM S: the words on this option's page and in every part's pop-up.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

name: SaaS CRM S
nickname: All on the CRM platform
tagline: >-
  Every part of the new system runs on the CRM platform, set up to work the way ICM works
  today.
summary:
  - In this option, the CRM platform replaces Siebel, the rules engine, the mainframe payment
    system and the monthly cheque run. Case work, applications, rules, notices, payments
    and the online portals all live in one CRM system. Rules, payments and
    history keep the shape they have today.
  - Prototyping and research has found that a replacement of ICM can technically be built this way,
    but the trade-offs are significant. Roughly a quarter of the total business capabilities required are included "out of the box"
    with the remainder being custom work built inside the SaaS platform. None of this is impossible as a whole - but the improvements 
    over the current ICM mechanisms are largely cosmetic and performance - the constraints are only marginally less confining that in ICM.
  - Beyond the technical complexity, the biggest catch is control. The CRM provider, not government, decides how the platform behaves,
    when it changes, and whether it runs at all. Moreover, all data must go through infrastructure wholly out of sight of government.
    Beyond that, there are several compromises business will have to agree to in order to make adoption workable.
facts:
  - label: Likely build effort
    value: 646 labour-months
  - label: Effort range
    value: 415 to 998 labour-months
  - label: Staff licenses given average posted prices
    value: >-
      About $44M to $80M a year, before discount and add-ons
  - label: Requirements met by setup alone
    value: 107 of 481 (22%)
goodAt:
  - It is the lowest-effort way to build the system on the CRM platform.
  - Rules become dated versions in one place, instead of old and new rule sets kept side
    by side.
  - Sealed records become possible. ICM has no way to seal a record today.
  - Overpayment amounts are worked out in the system, not printed, scanned and typed
    into the mainframe again.
  - There is familiarity within CSBC with several leading commercial CRM providers
watchOut:
  - The CRM provider sets its own upgrade dates. CSBC cannot freeze
    change around the monthly cheque run, which it can do today.
  - If the CRM provider cuts off access, no rules or screens can run anywhere else. Staff fall
    back to a manual procedures.
  - Most CRM providers do not make guarantees as to data recoverability, and typically offer SLOs with credit
  - Licences cost tens of millions of dollars a year at list price, every year, on top
    of the build.
  - The investment in the Data Lake and CriDIR would be discarded.
  - Any progress in MySS rebuild work would be discarded
  - In all but some CRM providers, administrative users often wield nearly unlimited permissions with potentially untraceable actions.
   Many actions cannot be strictly forbidden, only caught after the fact.
zones:
  people:
    name: People and partners
    blurb: >-
      The people who use the system: ministry staff, clients and the partners who work
      with them.
  crm:
    name: SaaS CRM platform
    blurb: >-
      One CRM system holds the screens, the case work for each program family and
      the services they share.
    groups:
      experience: Experience
      case-work-one-package-per-program-family: Case work, one package per program family
      shared-services: Shared services
  integration:
    name: Integration platform, on CSBC servers
    blurb: >-
      The integration platform is the CRM provider's product that connects the new system to banks, other
      governments and old systems. It runs on CSBC servers.
  counterparties:
    name: Outside organizations
    blurb: >-
      Banks, payment partners and other governments that send or receive information.
  ministry:
    name: The CSBC's own servers
    blurb: >-
      A few pieces stay on the CSBC's own servers: reports, a backup copy of
      records, the emergency payment plan and Siebel until it is switched off.
parts:
  workers:
    name: Workers
    short: About 9,400 ministry staff
    what: >-
      The ministry staff who use the system every day. That includes employment
      assistance and disability workers, CFD social workers, supervisors
      and finance staff.
    does: >-
      They take applications, assess need, record evidence, make decisions, issue
      notices and approve payments.
    why: >-
      Each staff account needs a CRM licence. With about 9,400 accounts, staff
      numbers drive most of the yearly licence cost.
  clients:
    name: Clients and representatives
    short: Applications, reports and requests
    what: >-
      People who apply for or receive assistance, and those who act for them.
    does: >-
      They apply, send monthly reports, ask for supplements and ask for a decision to be
      reviewed, mostly through the online portals.
    why: >-
      If the system is down or slow, clients cannot report or apply. Their payments and
      services depend on it.
  partners:
    name: Partners
    short: >-
      Indigenous authorities, agencies, caregivers, youth
    what: >-
      Organizations and people who share the work with the ministry. These include
      Indigenous authorities, delegated and contracted agencies, caregivers, youth and
      other parties to a case.
    does: >-
      They see and update the parts of a case they are allowed to, through their own
      portals.
    why: >-
      Partners need the right information on time. They must also never see records they
      have no right to see.
  console:
    name: Worker screens
    short: Where staff do their daily work
    what: >-
      The main screens ministry staff use, built on the CRM service console. It
      includes the phone system for the child protection reporting line.
    does: >-
      It shows each worker their cases and tasks, routes new work to the right queue,
      and lets supervisors watch workloads.
    why: >-
      This is where staff spend their day. Clear screens save time and cut errors on
      cases that affect people's income and safety.
    buildBuy:
      approach: buy
      label: >-
        Buy: CRM licence for each staff account
      summary: >-
        The screens come from the public sector package and the service desk product. The research priced them at US$275 to $500 per user
        per month at list price. Not every account may need the full licence, and no
        quote was sought.
      options:
        - name: Public sector package with the service desk product
          kind: buy
          note: Case screens, routing and supervision
        - name: Phone add-on for the service desk product
          kind: buy
          note: >-
            Phone calls for the reporting line, priced per user plus phone costs
    watch:
      tone: gap
      text: >-
        The 24/7 child protection reporting line runs on the same system as everything
        else. The CRM provider picks the maintenance and upgrade times for all of it. The line
        cannot get its own change window. That is not met today either.
    procurement: true
  portals:
    name: Online portals
    short: Online services for clients and partners
    what: >-
      Websites where clients, representatives, youth, caregivers and partner agencies
      sign in. They are built with the CRM portal product.
    does: >-
      Clients apply, send monthly reports, ask for supplements and ask for reviews.
      Partners work on their share of a case. The public can make reports.
    why: >-
      Good portals mean fewer phone calls and office visits. Sign-in uses the province's
      own login services, so people do not need another password.
    buildBuy:
      approach: buy
      label: >-
        Buy: the CRM portal product, priced per member or per login
      summary: >-
        The CRM portal product is a separate licence from the staff licence. The
        forms inside are built with the CRM's form tools, which come with the public sector package. The ministry already runs some CRM portals today.
      options:
        - name: CRM portal product
          kind: buy
          note: Client, partner and public sites
        - name: Existing CRM portals
          kind: existing
          note: >-
            Some current ministry portals already run on a commercial CRM platform
    procurement: true
  field-service:
    name: Field service
    short: Mobile work, even offline
    what: >-
      The CRM mobile tool for staff who work away from the office.
    does: >-
      It lets workers record visits in remote areas, even with no signal, and sends the
      notes in when they reconnect.
    why: >-
      Social workers visit homes far from cell coverage. They need to record what they
      saw at the time, not days later.
    buildBuy:
      approach: buy
      label: >-
        Buy: the CRM field service add-on, priced per user
      summary: >-
        The field service add-on is a separate licence for the staff who need it. It is not part of
        the basic staff licence.
      options: []
    procurement: true
  adult:
    name: Adult assistance and disability
    short: Employment and disability assistance cases
    what: >-
      The case work for employment assistance and disability assistance. It is one
      package of custom work inside the CRM platform.
    does: >-
      It handles applications, eligibility, monthly reports, supplements, overpayments,
      reviews and appeals.
    why: >-
      These cases decide whether people get paid each month. Of 103 requirements here,
      26 are met by setup alone and 56 need custom work.
    buildBuy:
      approach: build
      label: >-
        Build on the CRM platform, using parts of the public sector package
      summary: >-
        No CRM product models BC assistance law, so most of this is custom.
        The public sector package gives a starting data model for benefits, payments and
        assessments. Likely effort is about 5,570 person-days.
      options: []
    watch:
      tone: limit
      text: >-
        All program families share one CRM system and one data model. They cannot
        be changed or upgraded on their own timetables. ICM has the same problem today.
  child-protection:
    name: Child protection and care
    short: Reports, investigations, care, court
    what: >-
      The case work for child protection, guardianship, children in care and caregivers.
      It is custom work inside the CRM platform.
    does: >-
      It records reports and investigations, safety assessments, court orders, care
      plans and Indigenous jurisdiction steps.
    why: >-
      Children's safety depends on this work being recorded correctly and on time. BC
      child protection law needs custom work on any product, not only the CRM platform.
    buildBuy:
      approach: build
      label: >-
        Build on the CRM platform, using parts of the public sector package
      summary: >-
        The public sector package gives building blocks for care plans, assessments,
        provider management and court proceedings. The rules, deadlines and Indigenous
        jurisdiction steps are custom.
      options: []
    watch:
      tone: limit
      text: >-
        CRM maintenance happens at night and on weekends, when the reporting line
        is busiest. During those windows the system can be read-only, so staff may have
        to write reports down and enter them later.
  adoption:
    name: Adoption
    short: Adoption and post-adoption support
    what: >-
      The case work for adoption, including the adoption registry and post-adoption
      help. It is the largest single children's package.
    does: >-
      It tracks adoption plans, placements, post-adoption assistance and online
      applications.
    why: >-
      Adoption records must be kept for decades and some must be removed on demand by
      law. Likely effort is 760 person-days.
    buildBuy:
      approach: build
      label: >-
        Build on the CRM platform, using parts of the public sector package
      summary: >-
        Benefit and care plan parts in the public sector package cover some of the work.
        BC adoption steps are custom.
      options: []
  support-needs:
    name: Support needs and early years
    short: Children and youth with support needs
    what: >-
      The case work for children and youth with support needs, and early years services.
    does: >-
      It handles applications, eligibility, assessments, support plans and funding such
      as autism funding.
    why: >-
      Families rely on this funding. The ministry's current support needs portal already
      runs on the CRM platform.
    buildBuy:
      approach: build
      label: Build on the CRM platform, mostly by setup
      summary: >-
        Much of this fits the public sector package's benefit management with little custom
        code. Likely effort is about 260 person-days.
      options:
        - name: Existing support needs portal
          kind: existing
          note: Already a CRM partner portal
  conditional-four:
    name: Four more services, if in scope
    short: Only if the ministry adds them
    what: >-
      Four services that are not in ICM today: child and youth mental health, integrated
      child and youth teams, and youth justice in the community and in custody.
    does: >-
      If brought into scope, they would hold clinical records, care teams, funding
      requests and custody records.
    why: >-
      Adding them raises effort by about 2,710 person-days. Mental health would also
      need the CRM provider's health product, a separate licence.
    buildBuy:
      approach: build
      label: Build on the CRM platform, if in scope
      summary: >-
        Mental health would use the CRM provider's health product. No CRM product runs custody
        centres, so the research suggests buying a custody product and connecting it.
      options:
        - name: CRM health product
          kind: buy
          note: >-
            Clinical records, only for mental health and integrated teams
        - name: A custody operations product
          kind: buy
          note: If youth custody operations come into scope
        - name: Keep the current systems
          kind: existing
          note: These services run on other systems today
  evidence:
    name: Evidence
    short: Facts about each case, with dates
    what: >-
      Custom CRM records that hold the facts a decision is based on, such as
      income, household and address.
    does: >-
      Each fact has the dates it was true and when it was recorded. Changes are kept in
      a history trail for up to 10 years, then moved to long-term storage.
    why: >-
      Workers, reviewers and tribunals need to know what the ministry knew when it
      decided. ICM today overwrites many facts.
    buildBuy:
      approach: build
      label: >-
        Build on the CRM platform, with field history from the security add-on
      summary: >-
        Built as custom records inside the CRM platform. Field history tracking, part of the security add-on,
        keeps the history of up to 60 fields per record type for 10 years.
      options: []
    watch:
      tone: limit
      text: >-
        History is kept, but records can still be edited. Corrections are marked with a
        label rather than kept as a separate entry. It is still better than ICM today.
  rules:
    name: Rules
    short: Eligibility and payment rules
    what: >-
      The rules that decide who is eligible and how much they get. They run in the CRM provider's rules engine.
    does: >-
      It replaces the 29 rulebases in Oracle Policy Automation, the mainframe
      calculations, a rate table and 5 spreadsheets. Each decision keeps a record of the
      inputs, the rule version and the result.
    why: >-
      One home for each rule means the same answer for the same case. Policy staff can
      see which version of a rule applied on a given date.
    buildBuy:
      approach: platform
      label: >-
        Platform: the rules engine, part of the public sector package
      summary: >-
        Comes with the public sector package licence. Rewriting today's rules into it
        is about 1,180 person-days. How many rule runs the licence allows each month is
        unconfirmed.
      options: []
    watch:
      tone: limit
      text: >-
        Each decision is fully recorded, but administrators and CRM provider staff could
        change that record. The record is not sealed against tampering.
  clocks:
    name: Clocks and delegation
    short: Deadlines and who may decide
    what: >-
      A custom list of every legal and policy deadline, and a check on who is allowed to
      use each power.
    does: >-
      It tracks 138 adult deadlines plus the children's time limits, counting business
      days and holidays. Before a director's power is used, it checks that the person
      had that authority on that date.
    why: >-
      Missed deadlines and decisions by the wrong person can harm clients and be
      overturned on appeal.
    buildBuy:
      approach: build
      label: Build on the CRM platform
      summary: >-
        The CRM platform has business hours, holidays and case milestones to build on. The
        deadline list and the authority check are custom work.
      options: []
  access:
    name: Access and sealing
    short: Who can see which records
    what: >-
      The rules that decide which staff and partners can see which records, including
      sealed records.
    does: >-
      Each record gets an access class that limits who can open it. Sealed and
      restricted records are kept apart. The security add-on watches who looks at what and can block
      unusual access.
    why: >-
      Today more than a third of about 9,400 users held access they should not have had.
      Sealed records are new: ICM cannot seal a record.
    buildBuy:
      approach: build
      label: Build on the CRM platform, with security add-on monitoring
      summary: >-
        Built from CRM sharing and restriction rules. Event monitoring in the security add-on
        reports access to the province's security team.
      options: []
    watch:
      tone: limit
      text: >-
        Staff with full access, and programs running with full rights, can get past the
        restrictions. Keeping service lines apart depends on keeping those rights from
        people.
  notices:
    name: Notices and documents
    short: Letters, forms and court papers
    what: >-
      Templates for the notices, forms and court documents the ministry sends.
      Children's services alone need about 150.
    does: >-
      It fills in templates from case data and stores the PDF that was sent as the
      official copy.
    why: >-
      Clients have a right to clear written decisions. The stored copy proves what was
      sent and when.
    buildBuy:
      approach: platform
      label: >-
        Platform: document generation tool, part of the public sector package
      summary: >-
        Document generation comes with the public sector package. The CRM provider sells no
        e-signature product, so signing needs a separate product. DocuSign is already
        used with the ministry's CRM contract system.
      options:
        - name: Document generation tool
          kind: buy
          note: Part of the public sector package licence
        - name: DocuSign
          kind: existing
          note: >-
            Already in use with the contract management system
    watch:
      tone: gap
      text: >-
        If legal advice requires a digital certificate signature on some documents, no
        CRM product can do it. A separate product such as DocuSign would be
        needed.
  payments:
    name: Payments and debt
    short: Monthly payments and overpayments
    what: >-
      The monthly payment run and the records of what each client is owed and owes,
      built inside the CRM platform.
    does: >-
      It runs the monthly payments and sends cheque and direct deposit files to the
      bank, the mail service and the province's accounting system. It keeps debt records
      like the mainframe does today.
    why: >-
      Clients rely on being paid on time every month. Errors here cost money and cause
      real hardship.
    buildBuy:
      approach: build
      label: Build on the CRM platform
      summary: >-
        The CRM platform has no benefit ledger. Its billing and loan collection products were
        judged a poor fit for public sector overpayment rules. So the payment run and
        debt records are custom work.
      options: []
    watch:
      tone: gap
      text: >-
        The CRM provider sets its own upgrade dates three times a year. The ministry cannot
        stop an upgrade during the monthly cheque run, which it can do today.
  platform-services:
    name: Platform services
    short: Security, privacy, backup and reports
    what: >-
      CRM add-ons that every part of the system uses: encryption and access
      monitoring, privacy tools, test data masking, backup, dashboards and
      release tools.
    does: >-
      They protect data, keep history, apply retention rules, back up records and show
      managers how work is going.
    why: >-
      Records about children must be kept up to 90 years and others for shorter periods.
      These tools make keeping and destroying records on schedule possible.
    buildBuy:
      approach: buy
      label: >-
        Buy: several CRM add-ons
      summary: >-
        The security add-on is priced as a share of spend. The privacy, test data masking and backup add-ons, extra storage and test environments are each separate add-ons. Each analytics tool is priced per user. None of these is in the staff licence
        price.
      options:
        - name: Security add-on
          kind: buy
          note: >-
            Encryption, access monitoring, 10-year field history
        - name: Privacy and test data masking add-ons
          kind: buy
          note: >-
            Retention, deletion, and no personal data in test copies
        - name: Backup add-on
          kind: buy
          note: Priced by storage
        - name: Analytics tools
          kind: buy
          note: Dashboards and reports
    watch:
      tone: gap
      text: >-
        The CRM provider does not say how much recent data could be lost in an outage. It is
        also unknown whether a record can be fully removed from the CRM provider's backups
        when the law requires it.
    procurement: true
  integration-hub:
    name: Integration hub
    short: Connects to outside organizations
    what: >-
      The integration platform, the CRM provider's product for connecting systems, running on ministry
      servers.
    does: >-
      It passes data to and from banks, the mail service, the accounting system, Canada
      Revenue Agency, Service Canada, courts, police and others. It sends some data in
      files on a schedule.
    why: >-
      Payments, identity checks and court work all depend on these links. Running it on
      CSBC servers keeps it under the ministry's control.
    buildBuy:
      approach: buy
      label: >-
        Buy: the CRM provider's integration platform, priced by capacity
      summary: >-
        The integration platform is sold separately from the CRM licence. It runs on the
        ministry's own servers, so it is not affected by CRM maintenance.
        Building the connections is about 1,140 person-days.
      options: []
    watch:
      tone: limit
      text: >-
        The CRM platform keeps change messages for only 72 hours. A long weekend outage could
        lose some. That is still better than today.
    procurement: true
  siebel-connector:
    name: Siebel connector
    short: Links old and new during the switch
    what: >-
      A connector on the integration platform that lets the CRM platform and Siebel share data while both are
      running.
    does: >-
      It keeps cases in step between the two systems while work moves over in stages.
    why: >-
      Programs will move one at a time. Staff and clients must not lose information in
      between. This work is about 930 person-days.
    buildBuy:
      approach: buy
      label: >-
        Buy: an integration platform connector for Oracle Siebel
      summary: >-
        This is a premium connector, bought on top of the integration platform itself.
      options: []
    procurement: true
  finance:
    name: Finance partners
    short: Bank, mail service, accounting
    what: >-
      The bank, BC Mail Plus, the province's corporate accounting system and the
      Treasury.
    does: >-
      They receive payment files, print and mail cheques and notices, and record the
      money in the province's books.
    why: >-
      Every client payment passes through them. The links must work on time every month.
  government:
    name: Government and justice partners
    short: Other governments, courts, health
    what: >-
      Canada Revenue Agency, Service Canada, the courts, police, Vital Statistics,
      Pacific Blue Cross and others.
    does: >-
      They share information used to check eligibility, run court steps and provide
      health benefits.
    why: >-
      Correct, timely information from partners prevents wrong payments and supports
      child safety work.
  reporting-store:
    name: Reporting store
    short: Reports for managers and planners
    what: >-
      A copy of the data on CSBC servers, updated each night. It replaces the
      current data warehouse.
    does: >-
      Managers and analysts use it for reports and planning without slowing the main
      system.
    why: >-
      The ministry needs numbers to plan budgets and staffing and to report to the
      public.
    buildBuy:
      approach: build
      label: >-
        Build: nightly extract to CSBC servers
      summary: >-
        CRM dashboards come from the CRM provider's analytics tools. A nightly extract
        feeds the ministry's own reporting store.
      options:
        - name: Built-in CRM analytics
          kind: buy
          note: CRM dashboards, priced per user
        - name: Separate dashboard product
          kind: buy
          note: Can also run on CSBC servers
    watch:
      tone: limit
      text: >-
        Reports work from a copy made each night, as they do today. The goal of
        reporting without making copies of personal data is not met.
  continuity-store:
    name: Continuity store
    short: Backup copy of records, no functions
    what: >-
      A copy of the system's records on CSBC servers, kept up to date by a steady
      feed of changes from the CRM platform.
    does: >-
      It holds the records so staff can still look up cases and drive emergency payments
      if the CRM platform is unavailable.
    why: >-
      Without it, a supplier cut-off would leave staff with no case information and
      clients with no payments.
    buildBuy:
      approach: build
      label: Build on CSBC servers, fed from the CRM platform
      summary: >-
        The feed uses the CRM platform's change data capture, a paid add-on. The CRM backup add-on adds a second copy.
      options:
        - name: Change data capture add-on
          kind: buy
          note: Paid by usage
    watch:
      tone: gap
      text: >-
        The copy holds records only. No CRM rules or screens can run outside
        the CRM platform, so the system itself cannot keep working if the CRM provider cuts off
        access. Siebel never faced this risk.
  manual-payment:
    name: Manual payment procedure
    short: Emergency payments by hand
    what: >-
      The written plan for paying clients by hand if the CRM platform is cut off. It carries
      over today's business continuity plan.
    does: >-
      Staff use the continuity copy to make payments manually until service returns.
    why: >-
      People must still be paid if the system is down. A plan that is rehearsed works
      better in a crisis.
    buildBuy:
      approach: existing
      label: >-
        Existing: today's continuity plan, carried over
      summary: >-
        Today's plan already says payments may be made manually. It would be updated to
        use the new continuity copy.
      options: []
    watch:
      tone: limit
      text: >-
        Manual payments lose the automatic checks, limits and later corrections. Data
        may be slightly out of date.
  siebel:
    name: Siebel ICM
    short: The current system, until switched off
    what: >-
      ICM, the current case management system, built on Oracle Siebel and running on
      government servers.
    does: >-
      It keeps running for programs not yet moved, and shares data with the CRM platform
      through the connector.
    why: >-
      Switching off ICM too early would leave staff without records. Running both costs
      money, so a clear end date matters.
    buildBuy:
      approach: existing
      label: >-
        Existing: runs until it is retired
      summary: >-
        Siebel stays in place during the move and is shut down once every program is on
        the CRM platform.
      options: []
