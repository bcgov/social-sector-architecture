# The words on the home page.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

hero:
  title: Three ways to replace ICM
  lede: >-
    ICM powers the social sector. This site shows three ways it could be replaced.
why:
  heading: Why ICM needs replacing
  paragraphs:
    - ICM works...except when it doesn't. It takes a lot of effort to keep it working. 
     Workers must contend with an arcane and complex system that makes even simple things tediously complex and slow.
    - It is not just slow or clunky, ICM is missing core capabilities such as the ability to manage monthly payments. 
     It has failed to keep pace with the changes needed by business - leading to a sprawling mess of hacks, workarounds and bolt-ons.
    - ICM costs more and more each year, but the value it provides has been shrinking, and it never delivered on its promises.
optionsIntro:
  heading: The three options
  text: >-
    SaaS S puts everything on a SaaS CRM and runs it the way ICM runs today.
    SaaS H has the SaaS product used for case work and rules, and keeps money, evidence and
    records on the ministry's own servers. Event-driven has the ministry build in parts,
    buy or adopt common components, and link them through an event stream updated when something
    happens, such as a payment being issued.
howToRead:
  heading: How to read the diagrams
  steps:
    - Each option has a diagram. Boxes are grouped by who runs them, such as the SaaS provider
      or the ministry.
    - Click or tap any box to learn what it is, what it does and why it matters.
    - Look for the coloured notes. They show where an option falls short or fixes a
      problem.
compare:
  heading: The options side by side
  rows:
    - question: Who controls when it changes?
      s: >-
        SaaS Provider. It sets three major updates a year, and the ministry cannot pause
        them.
      h: >-
        SaaS Provider for case work and rules. The ministry for the payment run.
      e: >-
        The ministry. It runs the parts on its own servers and sets its own timing.
    - question: What happens if the supplier cuts us off?
      s: >-
        A copy of records can be kept. Payments fall back to a manual procedure.
      h: >-
        A ministry copy keeps intake, case viewing and repeats of the last payments
        running.
      e: >-
        Data stays on ministry servers. Open source parts limit reliance on one supplier.
    - question: Where does the money run?
      s: On the CRM platform, in a monthly batch run.
      h: >-
        On the ministry's own servers, with the ministry's own ledger.
      e: >-
        In payment and finance parts built for the ministry, on its own servers.
    - question: How much custom work?
      s: >-
        A lot. 346 of 481 requirements need building on top of the CRM platform.
      h: >-
        The same as S, plus the parts kept off the CRM platform.
      e: >-
        Custom building only for work unique to the ministry. Open source elsewhere.
    - question: What are the yearly licence costs?
      s: >-
        About US$31M to $56M a year at list price, before any discount.
      h: >-
        About US$31M to $56M a year at list price, before any discount.
      e: Not yet estimated
    - question: Is it worse than today anywhere?
      s: >-
        Yes. The ministry loses its change freeze around the monthly cheque run.
      h: >-
        Less so. The payment run keeps its freeze; work on the CRM platform does not.
      e: Not yet estimated
    - question: When could people use something new?
      s: >-
        About month 13 in our timeline sketch, after the licences are bought.
      h: >-
        About month 13 in our timeline sketch, after the licences are bought.
      e: >-
        About month 9 in our timeline sketch, with a read-only worker view.
cta:
  heading: Start with an option
  text: >-
    Pick an option to see its diagram and what it would mean for staff, clients and
    money. Nothing here is a decision. The ministry has not chosen an option.
