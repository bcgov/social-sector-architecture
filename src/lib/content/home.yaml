# The words on the home page.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

hero:
  title: Three ways to replace ICM
  lede: >-
    ICM powers the social sector. This site shows three ways it could be replaced.
why:
  heading: Why ICM needs replacing
  paragraphs:
    - ICM works...except when it doesn't. It takes a lot of effort to keep it working. 
     Workers must contend with an arcane and complex system that makes even simple things tediously complex and slow.
    - It is not just slow or clunky, ICM is missing core capabilities such as the ability to manage monthly payments. 
     It has failed to keep pace with the changes needed by business - leading to a sprawling mess of hacks, workarounds and bolt-ons.
    - ICM costs more and more each year, but the value it provides has been shrinking, and it never delivered on its promises.
optionsIntro:
  heading: The three options
  text: >-
    SaaS S puts everything on a SaaS CRM and runs it the way ICM runs today.
    SaaS H has the SaaS product used for case work and rules, and keeps money, evidence and
    records on the ministry's own servers. 
    Event-driven has the ministry build in parts buy or adopt common components, and link them through an event stream updated when something
    happens, such as a payment being issued.
howToRead:
  heading: How to read the diagrams
  steps:
    - Each option has a diagram. Boxes are grouped by who runs them, such as the SaaS provider
      or the ministry.
    - Click or tap any box to learn what it is, what it does and why it matters.
    - Look for the coloured notes. They show where an option falls short or fixes a
      problem.
compare:
  heading: The options side by side
  rows:
    - question: Who controls when it changes?
      s: >-
        SaaS Provider. SaaS providers set the update cadence, and CSBC cannot pause
        them.
      h: >-
        SaaS Provider for case work and rules. CSBC for the payment run.
      e: >-
        CSBC. It runs the parts on its own servers and sets its own timing.
    - question: What happens if the supplier cuts us off?
      s: >-
        A copy of records can be kept. Payments fall back to a manual procedure.
      h: >-
        A ministry copy keeps intake, case viewing and payment records - processing proceeds as normal.
      e: >-
        Data stays on ministry servers. Strategic component selection reduces reliance on one supplier.
    - question: Where does the money run?
      s: Using the CRM account ledger, pushed to a monthly batch EFT process, print cheques require custom solution.
      h: >-
        On the ministry's own servers, with the ministry's own ledger, EFTs can use existing components, print cheques can proceed as is.
      e: >-
        In payment and finance parts built for the ministry, on its own servers. Payment methods and processes can be fine-tuned.
    - question: How much custom work?
      s: >-
        A lot. Only about 1/4 of functionality comes "out of the box", half can be built using the platform's tools, with the remainder being custom extensions to the platform.
      h: >-
        By moving some functionality off to separate component, more functionality is available by default, that is partially offset by integration work. Custom work remains relatively constant. 
      e: >-
        Maximal use of acquired or adopted components; custom development only where business needs are unique.
    - question: What are the yearly licence costs?
      s: >-
        About $44M to $80M a year at list price, before any discount.
      h: >-
        About $44M to $80M a year at list price, before any discount.
      e: Variable based on components purchased vs. developed.
    - question: Do we lose anything by migrating?
      s: >-
        Yes. The ministry loses its change freeze around the monthly cheque run.
      h: >-
        Less so. The payment run keeps its freeze; work on the CRM platform does not.
      e: This can be chosen rather than determined by vendor choices.
    - question: When could people use something new (assuming a product team of approx. 12)?
      s: >-
        With a product team of 12, about 13 months after licenses are acquired.
      h: >-
        13 months after license procurement, though some non-user-facing components can be be built before licensing.
      e: >-
        Depending on sequencing choices, as early as month three - but most likely month nine. 
cta:
  heading: Start with an option
  text: >-
    Pick an option to see its diagram and what it would mean for staff, clients and
    money. 