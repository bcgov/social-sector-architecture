# Event-driven: the words on this option's page and in every part's pop-up.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

name: Event-driven
nickname: Built in parts
tagline: >-
  Smaller replaceable parts linked by messages. Reuse or buy common parts; build what is
  unique to BC.
summary:
  - This design was devised over several years including extensive field research, interviews,
    landscape analyses and other research. Instead of a single tightly integrated monolith,
    it is a set of smaller parts. Each part does one job, keeps its own records and belongs to a team.
    Common components can be adopted, like authentication, email, printing, or document intelligence or made available 
    like the event-broker, business rules engine, or orchestration service. CSBC builds only
    the parts that are unique to business' programs, such as eligibility rules and the management of
    determination of facts from claims and evidence, or process handling for the hundreds of exceptions, edge-cases
    and carve outs.
  - The parts talk to each other through events. An event is a short message that says
    something happened, like "a client submitted a monthly report" or "a payment was approved".
    Any part that cares can listen and act. Because no part reaches into another part's
    records, one part can be replaced without breaking the rest.
  - The new parts are switched on one area at a time, while ICM keeps running. A bridge
    into ICM lets old and new work side by side until each piece of ICM can be turned
    off.
facts:
  - label: Labour effort
    value: >-
      680 labour-months, in a range of 560 to 750.
  - label: Time to initial value
    value: 6-10 months.
  - label: Clear Win
    value: >-
      Notices, letters, forms and data validation can be implemented quickly and will immediately
      benefit ICM and be usable in future systems.
  - label: Build vs. Buy
    value: >-
      Mostly mature, well-supported open source products, many with commercial support.
      Build is focused on high-impact, mission critical components. 
goodAt:
  - Each element can be modified or replaced independently, so there is no vendor lock-in
    or software stack monopoly. These components can be re-used by other projects or spun
    out into common components. 
  - Every element is captured as structured data, including the claims, evidence, rules and processes, so it can be
    tested, validated and automated.
  - Policy staff can self-manage rates, and business rules through a tested release process and 
    a tool set they've already validated. No technician, no waiting for release.
  - ICM is replaced incrementally, with many features benefiting both the new system and ICM, and no "big bang."
  - Sensitive data and critical processes stay on the Province's own servers using trustworthy software.
  - Several components are already built or under way - a workflow orchestration system (Airflow in CriDIR),
    a business rules management system (BRE), a data integration gateway (EFV in DMI), a UX construction framework (MySS rebuild),
    a real-time data processing system and data lake (Spark, CriDIR), an anti-corruption layer for seamless migration (ICM-API)
  - Business areas were invested in and support of an event-driven architecture
  - Maximizing in-sourcing and internal knowledge development
  - Designed for AI from the ground up, every facet of the system can leverage AI tools now or in the future.
watchOut:
  - Many of the design commitments may be unfamiliar or unintuitive (e.g. there is no "CRM")
  - Initial development will focus on establishing a "kit" of capabilities, while they can be demonstrated
    they do not provide the immediate gratification of a commercial CRM tool.
  - Because there is no cut-over, both systems will run side-by-side for a time. Some improvements can be 
    back-migrated to ICM, this may seem like wasted investment, but the timelines warrant it.
  - CSBC, or those it hires, must build and run several elements itself. It needs a stable, capable team.
  - Engineering discipline must be maintained as part of team culture, rather than enforced by the 
    system itself, e.g. the event log can be misused, resulting in the tangled, tightly coupled mess of ICM.
zones:
  experience:
    name: Unified user experience
    blurb: >-
      AI-augmented from day 1. The screens and workflows people use, tailored to suit their context
      using an ever-growing library of smart components.
  api:
    name: Service abstraction layer
    blurb: >-
      An easy to use API layer for application authors (and AI) to construct service experiences.
      Frees developers and services designers from back-end implementation considerations.
      Allows back-end developers to make changes without disturbing the UX.
      These can be assembled very quickly by AI
  domain:
    name: Domain capabilities
    blurb: >-
      These domain capabilities encapsulate the elements of the system that are unique and high-value.
      By keeping them contained, this prevents commodity boilerplate from creeping in.
      These can be built by different teams in a polyglot environment and are easy for AI to reliably engineer.
  intelligence:
    name: Service intelligence
    blurb: >-
      These components allow the system to react adaptively to changes through orchestration and agents.
  events:
    name: Event broker
    blurb: >-
      The message line that carries news of every change from one part to the others.
  commodity:
    name: Commodity components
    blurb: >-
      Common tools every large organisation needs. These are reused from government,
      adopted as free software or bought, not built.
  gateways:
    name: Links to other systems
    blurb: >-
      Bridges to other organisations, and to ICM while old and new run side by side.
parts:
  worker-context:
    name: Worker Experiences
    short: What caseworkers and contact centre staff use
    what: >-
      The workflows, wizards, and agents ministry staff use daily. Caseworkers, supervisors, and contact centre staff
      each have tailored experiences for maximized ergonomics.
    does: >-
      Surfaces a client's context, aids in discovering necessary information, ensuring service quality and 
      managing tasks. Staff fulfill processes, act on work queues and access reports and information.
      The UX is self-explaining where it is not self-evident, accessible and multi-modal. 
    why: >-
      Staff must manage dozens of generic screens with workflows scattered and disorder among them.
      UX tools built around the specific needs for their tasks saves time and improves data and serve quality.
      The combination of component libraries, automated tests, and AI tooling makes designing, building, validating and testing 
      these very fast and very cheap.
    buildBuy:
      approach: build
      label: Build from a shared library of smart components
      summary: >-
        The design builds experiences from a common library of smart components built atop the GovBC design system.
        Smart components are not just UI widgets, they come pre-wired with the data to make them usable. 
        AI tools like Copilot can be provided skills or specialized agents to construct experiences through chat.
        Developers can also use AI to develop new components to add to the library.
        Rather than devolving into a junk drawer of gadgets, AI can both contend with tens of thousands of components easily
        and provide mechanisms for curation, deduplication, refactoring etc.
      options:
        - name: Shared library of smart components
          kind: build
          note: >-
            Accessibility is designed in, not applied later. Full experiences, not just UI widgets.
        - name: Provincial design system
          kind: existing
          note: >-
            Provides a kernel for expansion as new UI elements are developed.
        - name: >-
            Case platform screens (a SaaS CRM, Dynamics 365, Pega, Appian)
          kind: buy
          note: >-
            Not recommended. Full price for a sliver of the product, underlying model doesn't map well to new system.
  client-context:
    name: Client Experiences
    short: What people already receiving help use
    what: >-
      The online screens for people already receiving assistance or services, and for
      those acting on their behalf.
    does: >-
      Lets clients report changes, upload documents, read their notices and see their
      payments. Anything they can do online can also be done by phone, in person or on
      paper.
    why: >-
      Many clients cannot easily use a website. The design says no core process can
      be online only, so clients get the same result whichever way they reach the
      ministry.
    buildBuy:
      approach: build
      label: Build from the smart component library
      summary: >-
        Client experiences use the same shared building blocks as the worker screens. They
        reach the system through the same doorway, so they keep working as parts behind
        it are replaced. Different modalities (mobile, phone, in-person etc.) all share the same backing APIs, only 
        the UX changes.
      options:
        - name: Shared library of screen parts
          kind: build
          note: Same blocks as the worker screens.
        - name: Provincial design system
          kind: existing
          note: >-
            Used where it fits, behind the ministry's library.
  applicant-context:
    name: Applicant process
    short: Where people apply 
    what: >-
      These experiences are for those applying (or re-applying) for assistance, regardless of 
      method (web, mobile, phone, in-person)
    does: >-
      Manages the application process from information seeking to application decision.
      Delegates and workers have a dedicated experience, and the additional data is captured.
      Context is never lost so clients can go from web to in-person without starting over.
    why: >-
      Application processing is the single largest and most complex workload item for the ministry,
      it warrants a dedicated its own context. Ensuring applications are easy, reliable and accurate
      means clients get their needs met quickly, and the ministry cuts caseload significantly.
    buildBuy:
      approach: build
      label: MySS replacement underway
      summary: >-
        The MySS rebuild is already under way, the framework and components can all be re-used to
        develop the other experience contexts.
      options:
        - name: Smart Component Library
          kind: build
          note: Set the foundation for unified UX
        - name: Provincial design system
          kind: existing
          note: Adopt and extend.
  vendor-context:
    name: Partner and vendor experiences
    short: What service providers and partners use
    what: >-
      The processes and connections for outside organisations, such as service providers,
      contracted agencies and other partners.
    does: >-
      Lets partners see referrals and service agreements, report on services delivered,
      and send or receive information the law allows them to share.
      Also allows partners to configure self-service API end-points to securely integrate with our systems
      using verified credentials.
    why: >-
      Partners do much of the hands-on work for clients. Giving them their own access,
      limited to what an agreement allows, cuts phone calls and paper and protects
      client privacy.
    buildBuy:
      approach: build
      label: Build from the smart component library
      summary: >-
        Built with the same building blocks as the other experiences. What each partner may
        see is set by information-sharing agreements held in a register and enforced by the system itself, not granted by
        hand. The self-serve APIs and user experiences are backed by the same systems - simplifying access control.
      options:
        - name: Shared library smart components
          kind: build
          note: Same blocks as the other experiences.
  service-layer:
    name: Service abstraction layer
    short: Developer & AI friendly access to business systems (APIs)
    what: >-
      A unified access pathway to the back-end systems using APIs with published, standards ways 
      for providing capabilities.
    does: >-
      Standardizes the way UX components work with back-end systems, provides a broad surface area for automation.
      It allows AI and developers to quickly assemble targeted capabilities by composing underlying systems rather than writing entire
      functions from the ground up. Provides numerous built-in properties like security, persistence, scalability and durability that would otherwise be 
      coded for each feature.
    why: >-
      This layer can remain stable and accessible while the parts behind it or in front vary.
      Front-end developers can modify or add experiences, and back-end developers can adjust or replace components without
      either side needing to do anything. This also allows for a smooth transition from ICM - as requests would be initially
      routed to the legacy system before being taken over by the new one. Conversely, ICM can consume newer services 
      providing immediate benefit to ICM users before a complete replacement is available.
    buildBuy:
      approach: build
      label: >-
        Build the doorway, reuse the Province's API tools
      summary: >-
        The API structure (it's schema) are managed internally, and are subject to collaborative 
        governance. The components that publish those, and provide a single connectivity point are 
        already built - that's the core capability of the APS team.
      options:
        - name: API Governance
          kind: build
          note: >-
           Both the process and the software tools to support it can be developed quickly in-house. 
        - name: APS Team
          kind: existing
          note: Gateway and directory, adopted.
    watch:
      tone: risk
      text: >-
        Designing the API is a careful activity. If certain identifiers or data structures unique to ICM "leak through" we may
        inadvertantly undo the benefits of migrating to a modern architecture. Vigilance and engineering discipline are crucial.
  participant-identity:
    name: Participant identity
    short: Knowing two records are the same person
    what: >-
      This is ordinarily what a CRM element would do - and carry all the pertinent information about a person (their case).
      In this architecture, this part is very thin - holding just enough information to reliably correlate a person across all
      the data stores in the social sector (and potentially beyond). 
    does: >-
      Handles retrieval of records across systems to surface as part of the user experiences.
      Also provides anonymization, redaction, and other privacy protection measures.
      When a person's record in one place is altered, other components use this one to validate
      the identity in their own data.  
    why: >-
      A CRM, by holding all the information about an individual in a single database imposes strict
      limits on the scale and complexity of the processes that can be supported. All business applications
      must manipulate this unified shared representation of a client - if there are any differences the system breaks.
      Moreover, only a subset of information about a person is relevant at any given time for any given process.
      This is why government does not hold a monolithic store of all information about citizens. That same logic applies 
      within the social sector. 
    buildBuy:
      approach: build
      label: >-
        A small microservice with a highly secured database
      summary: >-
        A single identity provider within the social sector extends the architecture of government as a whole
        (e.g. the BC Services Card) - it provides a unified index for an unlimited number of services to 
        coordinate their data.
        By having the identity matching service built in, we maximize the ability to identify a client's context
        and provide relevant services - even when we lack precise identifiers.
      options:
        - name: Splink, Zingg, dedupe
          kind: open-source
          note: >-
            Free matching libraries that run on CSBC servers.
        - name: Senzing SDK
          kind: buy
          note: >-
            Commercial matching library that runs on CSBC servers.
  financial-components:
    name: Financial components
    short: An encapsulated accrual accounting and transaction management system
    what: >-
      Most decisions around a client ultimately result in an accrual accounting decision -
      their entitlement increments or decrements. Each month, whatever they are owed is paid
      and their balance is zeroed-out. The ledger of accruals must be immutable and separate from but traceable to
      an upstream decision or determination. 
    does: >-
      Converts each decision into an accrual accounting instruction (credit, debit, interest etc.)
      When payment is issues, balances the account in accordance with policy or specific instructions
      and issues a payment as appropriate. It also handles overpayment tracking and receivables. 
    why: >-
      Using an accrual accounting scheme with payment as a balancing action provides a clean,
      easy-to-audit, and easy to reason about record.
      Making the ledger immutable ensures all actions are captured and process defects are detectable 
      (e.g. if certain actions routinely trigger reversals, this can be picked up and fixed)
      By having every accrual action linked directly to a discrete decision, the integrity of the entire process
      is traceable from end to end, explaining payments to clients becomes trivial, and payment totals can be updated in real time.
      By separating the payment management from the ledger - flexible payment schedules and types become easy to adopt.
    buildBuy:
      approach: build
      label: Build with a simple CSBC-hosted database
      summary: >-
        A test compared a simple ledger table in PostgreSQL with three open-source ledger products.
        The plain table passed all nine tests, including tabulating 8 million entries in under five seconds. 
        This is unsurprising as relational databases were invented for precisely this purpose. 
      options:
        - name: Ledger table in the ministry's own database
          kind: build
          note: >-
            A simple PostgreSQL table conformant with ledger accounting standards.
        - name: TigerBeetle, Formance Ledger, Blnk Core
          kind: open-source
          note: >-
            Not recommended. Each requires special maintenance and only one ensures immutability.
        - name: Apache Fineract, Kill Bill
          kind: open-source
          note: >-
            Less recommended. They provide significantly more functionality than is necessary.
        - name: Commercial accural accounting products.
          kind: buy
          note: Initial research indicates market leaders would require heavy customization to suit the social sector context.
    watch:
      tone: risk
      text: >-
        The development of this mechanism, and indeed any financial components, must be 
        done in concert with the Comptroller General. This will add additional time and risk.
        Historically, the Social Sector was unique in handling its own payments. By volume,
        SDPR processes more transaction than the rest of government combined. 
  service-delivery:
    name: Service delivery
    short: Case work, one area per program
    what: >-
      The everyday case work, divided into components that correspond to business domains.
      Each component has its own database and functionality - but they collectively use
      the same commodity components. 
    does: >-
      Handles applications, eligibility checks, supplements, service plans and case
      reviews and other work items for its program. Each area uses the same 
      shared components for common needs like authentication, printing, notifications, scanning, etc.
    why: >-
      Constraining each program to conform to a standard model makes the software harder to develop
      and limits the opportunities for innovation and optimization, as we see in ICM. 
      Different areas have different needs and the software supporting them should be shaped around those
       - not the other way around.
      By the same token, these programs share much in common - by separating the common elements from the 
      unique ones, we can maximize the re-use of common components and minimize the duplication of effort.
    buildBuy:
      approach: build
      label: Build (assemble on the shared parts)
      summary: >-
        Miniziming the footprint of redundant components means building custom. A case
        platform is a single monolithic product that is not designed to be broken into parts.
        Moreover, platforms like a SaaS CRM, Dynamics 365, Pega and Appian reliably only the current state of a case, 
        not the full history of facts. Where it history is kept, it is as an unstructured log. Licence prices for about 9,400 staff run from about CAD 49 to 164
        million over three years before setup.
      options:
        - name: Program areas built on shared parts
          kind: build
          note: >-
            Recommended. Each program area is built on the shared parts, with its own
            database and team (though teams may have multiple program area components).
        - name: A SaaS CRM, Cúram, Dynamics 365, Pega, Appian
          kind: buy
          note: >-
            Not recommended as the record. Indivisible monolith, anemic history modeling.
    watch:
      tone: risk
      text: >-
        Without deliberate planning and adequate knowledge management, building the business components
        can result in a either a tangled, tightly coupled mess just like ICM, or a zoo of incompatible components. 
        Design standards are paramount, engineering discipline must be maintained, and a strong knowledge management program is 
        required to ensure that the design is followed and the parts are compatible. These internally focused efforts are frequently
        dispensed with in favour of "getting the work done" - but this is a false economy.
  provider-outcome:
    name: Provider and outcome management
    short: Service providers, placements and results
    what: >-
      The part that manages external services: facilities, placements, service
      agreements, referrals, plans and how well services worked.
    does: >-
      Records which provider is authorised to deliver which service to whom, under what
      agreement, and tracks the results. Works with the financial components to handle 
      accounts payable.
    why: >-
      Much of the help clients get comes from contracted providers. Clear agreements and
      outcome tracking help the ministry pay the right providers and see which services
      actually help people.
    buildBuy:
      approach: buy
      label: >-
        Comprehensive analysis of the market is still required, however early research
        indicates a strong market of commercially supported self-hosted open source products
        that would be suitable for this part.
      summary: >-
        Detailed build-vs-buy analysis is underway. Initial findings indicate several
        viable commercial and open-source products.
      options:
        - name: Buy or adopt
          kind: buy
          note: Weak recommendation. Market research is still underway.
  evidence-verification:
    name: Evidence and verification
    short: The permanent record of every fact
    what: >-
      The permanent record of every claim made by a client or applicant, the evidence 
      provided to support it, and the determination by the ministry worker of whether it is true.
      This combination of claim, evidence and determination is called a "fact". 
      The fact is the unit of truth in the social sector platform.
      The permanent record of every fact the ministry relies on, such as income, rent or
      family size. Each fact keeps track of several dates: when it was true, when it was asserted,
      when evidence was provided, when that evidence was verified, and when the ministry made a 
      decision about it. 
    does: >-
      Records lifecycle of each fact, without erasing old versions. It
      tracks whether each fact has been checked, and announces every change so other
      parts can act on it.
    why: >-
      Auditors, researchers, tribunals, and managers may ask what the ministry knew and when over long timespans.
      This record makes it easy to answer. It also provides an authoritative timeline of events, which is crucial
      for retroactive determinations, exceptions etc.
    buildBuy:
      approach: build
      label: Build on top of event broker
      summary: >-
        Recommended approach is to store each element of the fact record as an event in the event stream.
        This re-uses an existing component the system and makes workflow orchestration and automation easier to develop.
        How the social sector establishes and records facts, corrections, retractions etc is very specific to its needs,
        and evolves constantly. No ordinary database deals well with this "bitemporal" data - but event stores are designed for it.
      options:
        - name: Evidence store built on Apache Kafka
          kind: build
          note: Recommended.
  rules-engine:
    name: Rules engine
    short: Ensures all policies are applied, and eligibility determined correctly.
    what: >-
      The rules engine provides a way to capture and run the policy rules that determine procedural and substantive outcomes.
      More than a simple decision automator, it provides a full set of tools for policy staff to write, test and release rules safely.
      New rules can be tested against past facts, and past decisions can be re-run against new rules to see what would have happened.
    does: >-
      Accepts facts and rules as input, and produces a decision event with reasons. This event can trigger other parts to respond.
    why: >-
      Rules are policy expressed as code, and they change often. Closing the gap 
      between policy experts and the implementation saves time and reduces errors. 
      Letting policy staff test rules against production systems enables precisely accurate forecasting and research.
    buildBuy:
      approach: build
      label: >-
        Complete the Business Rules Engine work paused as part of AMP.
      summary: >-
        The Application Modernization Program (AMP) built a rules management system (BRE), 
        but it did not complete the migration of the rules itself.
        With AI tools and the new architecture, developing the complete ruleset could be done in a fraction of the time.
        The BRE uses the GoRules ZEN engine held in CSBC servers. The tools to 
        write, test, release and manage rules were built. In the alternative
        GoRule's commercial authoring product could be used, or other decision automation products considered.
      options:
        - name: Business Rules Engine (BRE)
          kind: build
          note: Recommended
        - name: GoRules paid authoring product
          kind: buy
          note: >-
            Not recommended. The BRE already has the authoring tools tailored to this usecase.
        - name: >-
            KIE Drools / Red Hat Decision Manager
          kind: buy-adopt
          note: >-
            The Apache KIE platform is a mature, well-supported business process automation system.
            If this were adopted as a corporate common component, it could be used to replace the BRE.
            However, it is a platform solution - too large to be used in a single project.
        - name: InRule
          kind: buy
          note: >-
            Not recommended. Product support has slowed, nearly abandonware.
    watch:
      tone: fixed
      text: >-
        The BRE was developed in collaboration with both RIPD and SDD. The project was led by a policy expert, and 
        the product was shaped specifically for this usage context. It is already well-supported by business.
  orchestration:
    name: Workflow (orchestration)
    short: Moves work through the systems
    what: >-
      Most work sequencing is handled via the event broker, but some workflows have a highly specific 
      sequence of steps that must be validated, gated and tracked. This can be built using the event broker alone,
      the combination makes it easier to build and maintain.
    does: >-
      Puts tasks in a sequential queue, parallelizes work where possible, and tracks completion, errors and deadlines.
      If a long job fails, it can pick up where it left, if it returns invalid data, it can redo the work. Works with
      the business rules engine and event broker to ensure the right work is done in the right order the right way.
    why: >-
      Large scale time sensitive workflows like monthly payments require highly reliable sequencing and exception handling.
      Long timescale workflows like annual check-ins require tracking and reminders.
      Clear queues, automatic reminders, and automated escalation procedures help staff keep on top of their work without manually capturing and tracking every step.
    buildBuy:
      approach: adopt
      label: Use the existing component, Apache Airflow.
      summary: >-
        The CriDIR project is building a production-ready Airflow instance within the ministry's private cloud.
        It, with Spark, is to be used to replace the informatica workflows.
      options:
        - name: Hybrid Airflow / KIE
          kind: open-source
          note: >-
            Recommended. Airflow is already deployed as part of CriDIR, adding Apache KIE provides a full-suite business and data automation layer.
        - name: Apache KIE
          kind: open-source
          note: >-
            Complete business automation platform, too large for a single product but if adopted as a common component, could be a viable replacement for many subsystems.
        - name: Camunda and Flowable cloud services
          kind: buy
          note: >-
            Not for this core part. Cannot show a ministry-held copy of data.
  intelligence:
    name: Intelligence
    short: Learning from the data
    what: >-
      This architecture was designed for AI integration from the ground up.
      The intelligence component is where AI tools can be applied to the data and processes to improve service quality, reduce costs, and improve outcomes.
      The AI can use the same analytical tools as our Business Intelligence team to spot trends, plan services and adapt to changes.
    does: >-
      Lets agents safely interface with the system at many different leves. 
      MCP endpoints allow AI to act as a user, or another component. The analytics tools
      allow AI to answer questions about the system as a whole. The orchestration components can use AI to perform tasks.
      All of this is done without exposing sensitive data outside government servers. 
    why: >-
      Today, data is copied and transformed and copied again and again for analysis.
      Increasing adoption of AI is going to massively accelerate this problem - with each copy being a privacy risk.
      By hybridizing analytics, orchestration, automation and AI, we provide the richest context and best observability
      for AI to act within. 
    buildBuy:
      approach: adopt
      label: >-
        Apache Spark, and the datalake along with open source AI integration tools.
      summary: >-
        The CriDIR project is building a production-ready Spark instance within the private cloud.
        It, with Airflow, is to be used to replace the informatica workflows. 
        The datalake will be built on top of this, and open-source AI integration tools will be used to provide
        a rich set of capabilities for AI to act within the system.
      options:
        - name: Apache Spark and related open-source tools
          kind: open-source
          note: Already under development
  event-broker:
    name: Event broker
    short: Carries news of every change
    what: >-
      The message line that links all the parts. An event is a short message that says
      something happened, like "income reported" or "payment approved". The broker
      delivers each event to every part that needs to know.
    does: >-
      Carries every fact and decision between the parts, and checks each message has the
      agreed shape. It keeps messages in order so a part that was offline can catch up.
    why: >-
      Because parts only talk through events, any part can be swapped out without
      rewiring the others. This is what lets ICM be replaced a piece at a time.
    buildBuy:
      approach: open-source
      label: >-
        Commercially supported open source products are recommended.
      summary: >-
        The messaging layer is standard, widely used and free to license. Apache Kafka
        is the most widely adopted and documented, with a long roster of support vendors.
        IBM-Confluent is the recommended commercial product if a corporate common component is the desired approach.
      options:
        - name: Apache Kafka
          kind: open-source
          note: Recommended.
        - name: Apicurio Registry or Karapace
          kind: open-source
          note: Register of agreed message formats.
        - name: Confluent
          kind: buy
          note: Recommended as corporate common component solution.
        - name: Redpanda
          kind: buy
          note: >-
           Best commercial product for single-project use.
    watch:
      tone: risk
      text: >-
        Kafka is a complex product, so internal teams must be adequately trained and supported.
        Proper governance on message formats is crucial to avoid a tangled, tightly coupled mess like ICM.
        This governance should be rolled into the API governance processes.
  client-identity:
    name: Client identity service
    short: Proving who a client is
    what: >-
      The provincial BC Services Card service, which proves a person is who they say
      they are when they sign in online.
    does: >-
      Confirms a client's identity at a high level of trust. The ministry keeps a
      reference to the result, not a copy of the person's details.
    why: >-
      Clients use the same card they use for other provincial services. The ministry
      does not have to build or guard its own identity checks, and it holds less
      personal data.
    buildBuy:
      approach: existing
      label: >-
        Existing: BC Services Card
      summary: >-
        The design treats identity as a common service and says reusing the provincial
        service is not a close call. The BC Services Card service is in production and
        is reached through the Province's single sign-on.
      options:
        - name: BC Services Card Authentication Service
          kind: existing
          note: In production.
  notifications:
    name: Notifications
    short: Emails and text messages
    what: >-
      The service that sends emails and text messages to clients and partners.
    does: >-
      Sends reminders, alerts and notice that a new letter is ready, and reports back
      whether each message was delivered.
    why: >-
      A timely reminder can stop a missed deadline or a cut-off payment. Reusing a
      government service saves building and running one.
    buildBuy:
      approach: existing
      label: >-
        Existing: provincial notification service, with a fallback
      summary: >-
        The design reuses the Province's notification service, which is still being
        developed. Because it may not be ready in time, it names fallbacks: the federal
        GC Notify service or the Province's Common Hosted Email Service.
      options:
        - name: Provincial notification service
          kind: existing
          note: In development. Readiness date to confirm.
        - name: Common Hosted Email Service (CHES)
          kind: existing
          note: Provincial email service. Fallback.
        - name: GC Notify
          kind: existing
          note: >-
            Federal service. Fallback, sends up to Protected A messages.
  documents:
    name: Documents
    short: Letters, notices and signatures
    what: >-
      The tools that build letters and notices from each decision, store documents, and
      collect electronic signatures.
    does: >-
      Fills a notice template with the decision, its reasons and the client's appeal
      rights. It stores documents and links each one to the fact it supports.
    why: >-
      A notice must always match its decision and state the right appeal period. Getting
      this right protects clients' rights and the ministry at a tribunal.
    buildBuy:
      approach: buy
      label: >-
        Buy or adopt several tools; build the link to each decision
      summary: >-
        Producing, and storing documents are common needs. 
        Common components are available, so the design targets these were possible. 
        This problem space typically requires a suite of tools, not a single product. 
      options:
        - name: Common Document Generation Service (CDOGS)
          kind: existing
          note: >-
            Provincial service for building documents from templates.
    watch:
      tone: risk
      text: >-
        There is widespread belief signatures are a legal requirement. This is a false, but seemingly very persistent belief.
    procurement: true
  chat-bots:
    name: Chat bots
    short: Automatic answers to common questions
    what: >-
      Online helpers that answer common questions by chat, any time of day.
    does: >-
      Answers questions like when the next payment is due or what documents to bring,
      and passes harder questions to a person.
    why: >-
      Quick answers to simple questions can cut phone wait times and free staff for
      clients who need more help.
    buildBuy:
      approach: buy
      label: >-
        Defer market analysis until closer to procurement - market is too volatile to make a decision now.
      summary: >-
        The pace at which this market evolves makes early analysis very unreliable. Recommendation is to 
        defer selection as much as possible.
      options:
        - name: Commercial or corporate chat bot service (if available)
          kind: buy
          note: Default, not yet analysed.
  printing:
    name: Printing
    short: Paper letters and cheques
    what: >-
      Integration with existing print-on-demand, push-print and mail services provided by BCMailPlus etc.
      Integration pattern is an coordinated sequence managed by the orchestration component to manage print queues etc. 
    does: >-
      Receives letters and cheques in batches, prints them and mails them, and reports
      back when they were sent.
    why: >-
      Many clients rely on paper. When a client prefers paper, every decision notice
      goes out on paper by default, with the same deadlines as online.
    buildBuy:
      approach: existing
      label: >-
        Existing: provincial print-and-mail service
      summary: >-
        The design reuses the provincial print-and-mail operation. No published way to
        connect to it automatically was found, so sending files in batches is assumed
        until confirmed.
      options:
        - name: Provincial print-and-mail service
          kind: existing
          note: Batch file connection assumed.
  verified-credentials:
    name: Verified credentials
    short: Digital proof clients can carry
    what: >-
      Digital proofs, held by the client in a secure app, that show a fact about them
      has been confirmed, such as being in receipt of a benefit.
    does: >-
      Lets a client prove a confirmed fact to another organisation without the ministry
      having to share their file.
    why: >-
      Clients often need to prove they get assistance. A digital proof saves trips and
      letters and shares only what is needed.
    buildBuy:
      approach: existing
      label: >-
        Not yet analysed (default: reuse a government service)
      summary: >-
        No build-vs-buy analysis has been done for verified credentials yet. The
        sensible default is to reuse a government service if one fits, and not build
        one.
      options:
        - name: Government digital credential service
          kind: existing
          note: Default, not yet analysed.
  document-scanning:
    name: Document scanning
    short: Turning paper into records
    what: >-
      Tools that scan paper documents, sort them, and read key details from them.
    does: >-
      Takes in documents from mail, fax, email, uploads and offices. It records the date
      each arrived, because legal deadlines run from that date.
    why: >-
      Lost or slow paperwork delays decisions. Values read by a machine are treated as
      unconfirmed until checked, so a scanning error cannot silently change a client's
      benefit.
    buildBuy:
      approach: open-source
      label: Adopt & Buy
      summary: >-
        Digitization of paper forms requires a full intake pipeline - from document capture (mobile capture, faxing, scanning etc.)
        to recognition and extraction. Pipeline orchestration is handled by the orchestration layer, with pluggable components.
      options:
        - name: Microsoft Document Intelligence
          kind: buy
          note: Existing supported component, incomplete solution.
        - name: Paperless-ngx
          kind: open-source
          note: Free scanning, indexing and archiving.
        - name: ABBYY Vantage
          kind: buy
          note: Commercial capture and data extraction.
  speech:
    name: Text-to-speech and speech-to-text
    short: Reading aloud and typing from speech
    what: >-
      Tools that read text aloud and turn spoken words into text.
    does: >-
      Reads screens and letters aloud for people who need it, and lets staff or clients
      speak instead of type. Can capture call-centre conversations in real-time and surface
      information and propose actions as appropriate.
    why: >-
      Text-to-speech is a crucial accessibility affordance, as many clients require but do not
      possess screen readers and other tools. Conversely, speech-to-text allows front line staff
      to have more direct and fluid interactions with clients and attend fully to the person in front
      of them or on the line. 
    buildBuy:
      approach: buy
      label: >-
        Defer assessment
      summary: >-
        This sector is under tremendous innovation, with new technology refinements released almost weekly.
        Recommendation is to defer this until closer to development time.
      options:
        - name: Commercial speech service
          kind: buy
          note: Defer until necessary.
  call-centre:
    name: Call centre systems
    short: Phones and contact centre tools
    what: >-
      The phone system and tools the contact centre uses to take calls.
    does: >-
      Routes calls and shows the agent the caller's file as the call arrives. Agents get
      their own screens, built for their tasks and time pressure.
    why: >-
      Phone contact has its own unique contextual requirements that should be designed around.
      Front line staff should have tailor built tools to maximize service quality and throughput.
    buildBuy:
      approach: buy
      label: >-
        There are many mature and powerful call centre management systems that have well documented 
        APIs for integration. Configuring a VoIP or phone tree system is a commodity problem. 
        Integration work and UX for the web application should be in-sourced.
      summary: >-
        This is among the most commoditized solutions within the social sector, there is little yield in a custom solution.
      options:
        - name: Current contact centre phone system
          kind: existing
          note: It may make the most sense to continue using existing system or consolidate with other groups.
  payment-processing:
    name: Payment processing
    short: Sends money by deposit and cheque
    what: >-
      Segmenting this from the financial components minimizes coupling between how payments are
      calculated and track from the particulars of ensuring money shows up in someone's account.
    does: >-
      Processes payment instructions, sends money, and reports results, e.g. stop payments reissues, returned
      payments, month-end cutoffs. Ensures payments track the financial details exactly.
    why: >-
      Flexibility and durability of payment processing is a mission-critical priority. 
      Supporting a range of payment provision mechanisms with a standard interface 
      ensures a diversified portfoli of options.
    buildBuy:
      approach: build
      label: >-
        Build one payment API (proposed); reuse provincial services
      summary: >-
        The design builds a payment API that creates a single interface to multiple payment providers.
        All payment traffic goes through this. Card payments, cheque payments, declining balance cards
        and others can be adopted, vendors changed added or removed, without altering any internal systems.
      options:
        - name: Payment API
          kind: build
          note: Standardized payment API for internal systems, can be built and adapted using AI.
        - name: >-
            Provincial payment path and corporate financial system
          kind: existing
          note: Card payments and accounting go through these.
        - name: cadeft
          kind: open-source
          note: >-
            Small library to write the bank file.
        - name: Hosted payment hubs
          kind: buy
          note: >-
            Payment hubs can handle discharge, reconciliation, retries, verification etc.
    watch:
      tone: risk
      text: >-
        Historically, the social sector has handled all payment processing internally - fully
        replicating Finance's process using social sector staff and contractors.
  user-analytics:
    name: User analytics
    short: How people use our systems.
    what: >-
      Tools that measure how people use experiences, where they get stuck, drop off, visit regularly, etc.
    does: >-
      Tracks visits, clicks, and drop-offs, can provide more fine-grained analyics (time in focus, time on screen etc.) for targeted
      sections. Can connect users across all contexts - phone, in-person, web, etc so we can measure the user journeys.
    why: >-
      One cannot manage what they do not measure - a unified user analytics system that's configured to conform to 
      the real business demystifies design decision-making.
    buildBuy:
      approach: open-source
      label: >- 
        Apache Flagon, Plausible, Matomo - this ensures granular data collection without privacy or disclosure risks.
      summary: >-
        A self-hosted solution is the most reliable and privacy protecting solution. There is little advantage with
        commercially supported options vs. widely adopted open-source solutions.
      options:
        - name: Open-source web analytics
          kind: open-source
          note: Apache Flagon
  reporting:
    name: Reporting
    short: Reports without copying data
    what: >-
      The reports managers, finance and the public rely on, drawn from one protected
      data store.
    does: >-
      Produces caseload, payment and performance reports by reading from a single data lake,
      rather than from an ETL'ed copy of a copy of a copy...
    why: >-
      ICM's data is copied over and over for reports, and every copy is another privacy
      risk. One store makes it possible to answer where a client's information is held.
    buildBuy:
      approach: Build
      label: >-
        This infrastructure is what CriDIR is building - this component can be integrated easily.
      summary: >-
       Reporting should not be treated as a monolith. Internal operational reports should be captured by the user experience development.
       Aggregate reports and research should be made available via the data lake as an authoritative store and analytics teams can choose which tools they prefer.
      options:
        - name: Apache Iceberg and Spark
          kind: open-source
          note: Part of the CriDIR infrastructure. Additional processing applications like Trino may be desired.
  health-monitoring:
    name: Health monitoring
    short: Spotting problems early
    what: >-
      Tools that watch every part of the system and alert the support team when
      something slows down or breaks.
    does: >-
      Tracks speed, errors and failed messages across the new parts, ICM, the payment
      path and printing.
    why: >-
      Problems are caught before clients or staff feel them. This matters most on
      payment days.
    buildBuy:
      approach: existing
      label: >-
        Existing: provincial monitoring services
      summary: >-
        The design reuses the monitoring built into the Province's private cloud, and
        the Province's monitoring service for systems outside it. Keeping records longer
        than thirteen months is the ministry's to build.
      options:
        - name: Private cloud platform monitoring
          kind: existing
          note: For parts on the platform.
        - name: Provincial monitoring service
          kind: existing
          note: For parts outside the platform.
  policy-governance:
    name: Access policy governance
    short: Written, tested rules on who sees what
    what: >-
      Not to be confused with government policy - access policy governance is an automated system.
      Rules about who may see or change which records, written as testable, portable code rather than 
      managed through traceless configuration settings.  
    does: >-
      Checks every request against the access rules and records who looked at what, for
      what purpose, and under what law. Integrates with APS P2P to fulfill transparency requirements.
    why: >-
      Multiple heterogenous systems need to support authorization - conventional methods mean each
      must develop and maintain their own authorization scheme and these must be kept in sync.
      Externalizing it as a service provides a single control plane for every application with comprehensive auditing.
    buildBuy:
      approach: open-source
      label: Adopt business rules engine
      summary: >-
        The business rules engine is suitable for access management purposes - whichever system is selected
        for that should be adopted here (and vice versa)
      options:
        - name: >-
            Open-source policy engine
          kind: open-source
          note: Rego or Cedar based solution is recommended.
  auth:
    name: Sign-in and access
    short: Signing in for staff and businesses
    what: >-
      The provincial sign-in services for staff, businesses and partners.
    does: >-
      Lets staff sign in once with their government account, and lets businesses and
      partners sign in with BCeID. Clients sign in with their BC Services Card through
      the same service.
    why: >-
      Reusing provincial sign-in saves building and securing a new login, and staff use
      the same account as for other work.
    buildBuy:
      approach: existing
      label: >-
        Existing: Province's single sign-on and BCeID
      summary: >-
        The design reuses the Province's Common Hosted Single Sign-On, which is free to
        ministry teams and already in production, and BCeID for businesses. Passing a
        person's legal permission between organisations is a gap that must still be
        built.
      options:
        - name: Common Hosted Single Sign-On
          kind: existing
          note: Staff sign-in. In production.
        - name: BCeID Basic and Business
          kind: existing
          note: Business and partner sign-in.
  data-gateway:
    name: Data integration gateway
    short: Sharing data with other organisations
    what: >-
      The approved route for sharing information with other ministries and
      organisations, through the Province's Secure Data Exchange.
    does: >-
      Checks that each exchange is allowed under a recorded agreement and law, sends it
      securely, and keeps proof of what was shared.
    why: >-
      Clients' information must only go where the law allows. Keeping proof of every
      exchange protects clients and lets the ministry answer access-to-information
      requests.
    buildBuy:
      approach: existing
      label: >-
        Eligibility Factor Verification and APS P2P provide a full connectivity and data availability solution.
      summary: >-
        APS P2P provides transport and access, whereas the EFV provides data transformation, integration and enrichment functionality.
        Extending either of these with the desired functionality has the best ROI.
      options:
        - name: APS P2P and EFV
          kind: existing
          note: Both under early development.
        - name: Proof-of-exchange records
          kind: build
          note: X-Road server or equivalent proof-of-record.
    watch:
      tone: risk
      text: >-
        EFV and APS P2P are in early stages of adoption, and policy-as-a-service is not yet deployed. 
        EFV scope would increase to accommodate the full breadth of possible data inputs and outputs for ICM.
  icm-api:
    name: ICM API
    short: Temporary bridge to the old system
    what: >-
      A temporary bridge into ICM, so new parts and ICM can work side by side while ICM
      is replaced piece by piece.
    does: >-
      Translates requests between the new system's language and ICM's. It sends changes
      made in ICM out as events, and writes back to ICM where needed.
    why: >-
      It avoids a risky single switch-over day and allows ICM to enjoy some enhancements.
      The goal is to shrink the ICM side of the API until it is completely handled by the replacement system.
      New system remains backwards compatible with ICM-integrated systems.
    buildBuy:
      approach: open-source
      label: Apache Camel
      summary: >-
        Apache Camel is purpose-built for live integration between modern and legacy systems. 
        It can form the backing service for the ICM API in a scalable and easily managed system
        as opposed to a library of microservices.
      options:
        - name: Camel 
          kind: open-source
          note: Temporary by design.
    watch:
      tone: risk
      text: >-
        The API contract exposed to external systems must avoid reproducing ICM's idiosyncratic design patterns.
        There is no automated way to ensure this, design rigor and governance of the API contract are required.