#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

placeholder: true
intro: >-
  ICM-Siebel has carried social sector business processes for many years. Thousands of front-line staff make it work daily, often by working around it.
  This page outlines a handful of problems people run into and have been the subject of voluble and long-running complaints. It is important to draw
  the right lessons from each problem by identifying the root cause - which tells us what a replacement has to do differently.
problems:
  - id: bad-ux
    title: Clunky, Slow, Obtuse UX
    who: >-
      Everyone who uses ICM
    see: >-
      Simple tasks are convoluted. Everything is complicated. Spinny wheel forever. Six weeks of training to just use a case management system.
    apparent: >-
      The system is old. Bad engineering has bogged it down. It's too bloated. Nobody listens to users.
    real: >-
      The way Siebel is designed makes feature development indirect and very rigidly constrained.
      Because Siebel has one UX for everyone, the UI remains generic, rather than ergonomic.
      The data model in Siebel makes it difficult to create fast behaviour, and easy to make very slow features.
    example: >-
      Displaying a single PDF form can take a dozen clicks, and tens of minutes to render.
      Some queries can bog the system down so badly it crashes.
      The UI has not been updated since 2011.
  - id: changes
    title: Even small changes are expensive, slow and risky
    who: >-
      EAWs, managers
    see: >-
      Release management is an Apollo launch mission. The live defect count will never reach zero.
      Each problem gets worse, problems get more frequent, and enhancement requests get sliced thinner and thinner.
      The cost of the system climbs steadily despite producing the same or less value.
    apparent: >-
      Sloppy and hasty work has accumulated technical debt that never got paid down.
    real: >-
      Case-file centricity means every system component depends on a single core entity.
      Limitations of the model and the way features can be developed require hacky work arounds as the only viable solution.
      The core system mismatches the business domain, resulting in bolted-on features which are difficult to test.
    example: >-
      Invalid EFT information can go unnoticed until after cheque issue. Social insurance numbers can be arbitrary strings.
      A defect in one small component can cascade to a full system failure, resulting in roll-backs, emergency fixes and heroics.
      Defects can go undetected or unremedied for months or years - and are almost always discovered first by end users.
  - id: core-features
    title: Core features are after thoughts.
    who: >-
      Policy, EAWs, operations teams
    see: >-
      Core business activities involved heavy customizations, hacks and bolt-on components to make possible.
    apparent: >-
      COTS + Customization is a common anti-pattern.
    real: >-
      System was selected for fit on only a single dimension. Siebel, a monolithic application, was treated like a platform.
      Many features were anticipated to be native, never materialized. 
    example: >-
      Complex financial processing remains locked with MIS because no equivalent capability is possible within Siebel.
      Cheque issue, the most important activity in the social sector, and Siebel can't deliver it.
  - id: extension
    title: Extension is infeasible
    who: >-
      EAWs, partner programs, clients
    see: >-
      ICM's API requires a "Trusted Systems" model that doesn't scale and conflicts with government strategy.
    apparent: >-
      The system has been too heavily customized to use an API.
    real: >-
      The API circumvents all authorization access requiring downstream applications to implement all security measures.
      The data schema is unintelligible without the application layer to link things together.
    example: >-
      CFD Mobility project must maintain a large middleware stack to compensate for the lack of a security service.
      Request payloads require processing overhead of Siebel even for simple queries.
  - id: auditing
    title: Auditing and reviews rely on poor security practice
    who: Security and privacy staff, Managers, Tribunals and Auditors.
    see: >-
      System logs are the primary mechanism for auditing system behaviour, including user actions and evaluations.
      The system itself has no concept of change over time, and so tracking data changes is a special feature for each instance.
      System logs capture highly sensitive information in plain text in a consolidated, easily downloaded format.
      Auditing and incident response is a sleuthing exercise rather than a simple query.
    apparent: >-
      It has not been prioritized as a target for development.
    real: >-
      ICM lacks an alternative structure to capture bitemporal information - it is completely out of band.
      Change events are captured implicitly by the database and are not themselves system data.
      The sensitivity of the log contents and lack of protections eliminate most log processing tools from consideration.
    example: >-
      An information incident requires manual recovery and are typically only discovered well after the fact.
      Tribunals rely on incomplete information when making determinations - because full details are not captured.
  