# The words on the problems page.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

placeholder: true
intro: >-
  ICM has carried employment assistance, disability assistance and child protection for
  years. Staff make it work every day, often by working around it. This page sets out
  six problems people run into. For each one we show what people see, what seems to
  cause it, and what really causes it. Knowing the real cause tells us what a
  replacement has to do differently.
problems:
  - id: many-systems
    title: One task, several systems
    who: >-
      Caseworkers in employment and disability assistance
    see: >-
      Workers jump between screens and systems to finish one piece of work. They type
      the same numbers in more than once.
    apparent: >-
      Sample: It looks like staff need more training, or that the screens are badly laid
      out.
    real: >-
      Sample: The systems were never built to share information. Each one holds part of
      the case, so the worker becomes the link between them.
    example: >-
      Recovering an overpayment means working out the amount in a separate web tool,
      printing it, scanning it back into the case, and typing it into the old payments
      system by hand. Across 326 written procedures, 207 need two or more systems to
      finish one task.
  - id: access
    title: Too many people can see too much
    who: >-
      Clients, families, and the staff who protect their privacy
    see: >-
      Staff can open records they have no reason to see. Links to other systems can get
      around the access rules altogether.
    apparent: >-
      Sample: It looks like a few people were given the wrong permissions by mistake.
    real: >-
      Sample: Access is granted by hand, one person at a time, and nothing ties it back
      to the job a person does or the law that allows the sharing. Over the years it
      drifts.
    example: >-
      An audit found that more than a third of about 9,400 users had access outside the
      approved access model.
  - id: rules-scattered
    title: The rules live in six places
    who: >-
      Policy staff, caseworkers, and clients who need a fair and correct decision
    see: >-
      When a rate or rule changes, it has to be found and changed in several places.
      Some of those places are spreadsheets on a shared drive.
    apparent: >-
      Sample: It looks like rule changes are slow because the technology team is busy.
    real: >-
      Sample: No single place holds the rules. Each new need was met wherever it was
      quickest at the time, and nobody owns the whole picture.
    example: >-
      Rules sit in a rules engine with 29 rulebases, the old payments system, formulas
      inside the case system, a database table, 18 SharePoint spreadsheets and the
      policy manual. Five of the spreadsheets decide what people are entitled to, with
      no version control or audit trail.
  - id: money-checks
    title: Money is checked by eye
    who: >-
      Finance staff, and clients waiting on a payment or a correction
    see: >-
      Staff check that payments add up by comparing reports by hand. Mistakes can take a
      long time to find.
    apparent: >-
      Sample: It looks like the finance team needs more people at month end.
    real: >-
      Sample: There is no proper set of books for benefit payments. The system records
      that a payment happened, but not in a way that balances on its own.
    example: >-
      Reconciliation today is done by eye, with an Excel log of cheques kept alongside
      it.
  - id: routing-spreadsheet
    title: A spreadsheet decides who does what
    who: Supervisors and staff who manage work queues
    see: >-
      Work lands in a queue with a priority and a deadline, but nobody can see in the
      system why. Changing how work is routed means editing a spreadsheet.
    apparent: >-
      Sample: It looks like a small admin task that someone keeps up as a favour.
    real: >-
      Sample: ICM cannot hold the service targets and routing rules itself, so they
      moved outside it. They are now kept up by hand with no record of who changed what.
    example: >-
      One Excel workbook decides which queue a request joins, how urgent it is and how
      long it has. Fifty-six procedures point to it, and one sheet maps 445 form numbers
      to how each is handled.
  - id: stopped-partway
    title: The last replacement stopped partway
    who: Everyone who uses or pays for ICM
    see: >-
      Old systems still run beside ICM. Staff keep using them, and the province keeps
      paying to run them.
    apparent: >-
      Sample: It looks like the last project simply ran out of time.
    real: >-
      Sample: Each year, small budget cuts and short-term fixes added up. No firm date
      forced the old systems to be switched off, so they stayed on.
    example: >-
      The project that built ICM spent $182 million in capital and replaced about a
      third of the older systems. The most important older system is still in use.
