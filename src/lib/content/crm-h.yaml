# SaaS CRM H: the words on this option's page and in every part's pop-up.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

name: SaaS CRM H
nickname: CRM platform plus CSBC servers
tagline: >-
  Case work and rules on the CRM platform. Money, decision records and a backup copy stay with
  CSBC.
summary:
  - In this option, workers, clients and partners use the CRM platform for case work, online
    portals, notices and the business rules that drive process. The CRM platform is a large
    software-as-a-service running on the providers systems, not the CSBC's.
  - The parts that are most critical move to CSBC's own servers. These are the
    payment run, the financial ledger, the evidence (documents and submissions), the record of each
    decision, and a live backup copy of the records. CSBC changes those parts on
    its own calendar, so the CRM provider's upgrade dates cannot land in the middle of the
    monthly payment run.
  - This costs more than putting everything on the CRM platform. The team has to build and run
    the CSBC-side parts and join two platforms together. In return, if the CRM platform
    ever cut off access, clients could still be paid the same amount as last time. New
    decisions would wait until the CRM platform came back.
facts:
  - label: CRM-side effort (likely)
    value: >-
      750 labour-months, in a range of 474 to 1,146. Approx $34M to $53M in labour costs.
  - label: CSBC-side parts
    value: >-
      320 labour-months, in a range of 280 to 725. Approx $14.5M to $23M in labour costs.
      This scope is: financial components, evidence/document management, decision records and back-up.
  - label: CRM licences
    value: >-
      Varies according to vendor, given market average: $44M to $80M a year at list price for about 9,400 staff, before
      discount. Portal logins, the integration platform and add-ons are extra and like make the discount a wash.
  - label: Upgrade testing
    value: >-
      About 90 to 210 labour-days a year to test each of the CRM provider's three yearly
      upgrades.
goodAt:
  - The monthly payment run sits on the CSBC's own servers and is changed on
    CSBC's own calendar.
  - Each decision is copied off the CRM platform into an queryable and auditable store.
  - If the CRM provider cut off access, staff can still view case snapshots, manually process new applications
    and repeat last month's payments.
  - CSBC gets a trusted internal ledger that balances every transaction and accrual.
  - Work screens, portals, and business rules capabilities come built-in with the CRM platform - but still require customization, as in the all-CRM option.
watchOut:
  - If the CRM provider cuts off access, ordinary business processing halts - back-ups capture point in time, but regular business activity requires CRM.
  - Everything within the CRM platform, including business rules, gets upgraded on CRM provider's schedule.
  - The CSBC-side estimates are predicated on small licensing footprint, additional proprietary systems will drive up licensing.
  - Two platforms must be joined and kept in step, which adds work and more places for
    things to break.
  - All SaaS major CRM providers are subject to the USA CLOUD Act regardless of residency of the system 
    and social sector data (regardless of classification) must flow through their managed Landing Zones, which are opaque to government. 
  - The CRM is unlikely to make effective use of the on-premise data lake being built as part of CriDIR
  - The work on the MySS rebuilt would be invalidated and a rebuild within the CRM tool would be necessary
  - Licences are large, recurring and complex to optimize.
zones:
  people:
    name: People and partners
    blurb: >-
      The people who use the system every day:  government staff, clients and the agencies
      and service providers who work with them.
  finance:
    name: Finance partners
    blurb: >-
      Banks, credit unions and government financial authorities that manage payment distribution.
  crm:
    name: SaaS CRM platform
    blurb: >-
      The part run by the CRM provider on its own computers: the screens, the case work, the
      rules and the notices.
    groups:
      experience: Experience
      case-work: Case work
      services-in-crm: Services in the CRM platform
  integration:
    name: Integration platform, on CSBC servers
    blurb: >-
      Connecting software, bought from the CRM provider but run on CSBC's own servers,
      that carries information between the CRM platform and everything else.
  ministry:
    name: The CSBC's own servers
    blurb: >-
      The parts the CSBC runs itself and changes on its own calendar: money,
      decision records, evidence and the backup copy.
    groups:
      money: Money
      decisions-and-evidence: Decisions and evidence
      events-and-backup: Events and backup
  government:
    name: Partner systems
    blurb: >-
      Social sector partners that help deliver services, or whose information contributes to a connected service experience.
parts:
  workers:
    name: Workers
    short: About 9,400 government staff
    what: >-
      Employment assistance workers, aseworkers, supervisors, intake staff etc.
    does: >-
      They take applications, check eligibility, plan services, and
      approve payments. They do almost all of this in CRM screens.
    why: >-
      Staff spend their whole working day in this system. How well it works decides how
      fast clients get help and how much time gets wasted in process.
  clients:
    name: Clients and representatives
    short: People applying for or getting help
    what: >-
      People who apply for employment assistance or disability assistance, youth and
      families, and anyone acting for them.
    does: >-
      They apply, send monthly reports, ask for supplements, ask for a decision to be
      looked at again and upload documents through online portals.
    why: >-
      Clients depend on the money and services arriving on time. A system they can use
      on their own saves them trips, time and phone calls.
  partners:
    name: Partners
    short: Agencies, caregivers and youth
    what: >-
      Delegated and contracted agencies, Indigenous authorities, foster caregivers and
      youth in care.
    does: >-
      They see and update the parts of a case they are allowed to, through their own
      portals.
    why: >-
      Much of child protection work is done by partners. They need the right
      information, and only the right information, to keep children safe.
  finance:
    name: Finance partners
    short: >-
      Bank, BC Mail Plus, government accounting, Treasury
    what: >-
      The bank, the print vendor BC Mail Plus, the government's corporate accounting
      system and Provincial Treasury.
    does: >-
      They receive the payment files for direct deposits and cheques. They send back
      what was paid, returned or rejected so it can be matched up.
    why: >-
      This is where money actually reaches clients. Every file must be right, on time
      and checked against what the bank says it paid.
  console:
    name: Worker screens
    short: Staff screens, routing and phone line
    what: >-
      The main screen staff work in, built from the CRM platform's standard tools. It includes
      work queues and the phone system for the reporting line.
    does: >-
      It shows each worker their cases and tasks, sends new work to the right person and
      lets supervisors watch the workload. Reporting-line calls come straight into the
      case.
    why: >-
      A clear console means less time hunting for information and fewer missed tasks.
      Its look and its upgrade dates are set by the CRM provider, not the ministry.
    buildBuy:
      approach: buy
      label: >-
        Buy: CRM licence for each staff member
      summary: >-
        The console comes bundled with most CRM providers', licensed per staff
        member. The phone feature is typically a separate per-user licence.
      options:
        - name: Phone bank console
          kind: buy
          note: Included in the per-user licence.
        - name: VoIP add-on for the service desk product
          kind: buy
          note: >-
            For reporting-line calls. Extra per-user licence plus phone charges.
    watch:
      tone: gap
      text: >-
        The CRM provider upgrades this three times a year on its own dates. CSBC
        cannot pause those upgrades.
    procurement: true
  portals:
    name: Online portals
    short: Websites for clients and partners
    what: >-
      Websites built on the CRM platform for clients, representatives, youth, caregivers and
      partner agencies.
    does: >-
      Clients apply, send monthly reports and request supplements. Partners see their
      share of a case. Guided forms walk people through each step.
    why: >-
      Good portals cut phone calls and office visits. They also cut retyping by staff,
      which is where errors creep in.
    buildBuy:
      approach: buy
      label: >-
        Buy: the CRM portal product
      summary: >-
        Portals use the CRM portal product, licensed per member or per login. CSBC has numerous CRM portals today.
      options:
        - name: CRM portal product
          kind: buy
          note: >-
            Priced per member or per login, on top of staff licences.
    watch:
      tone: gap
      text: >-
        Portals are on the CRM provider's upgrade dates and stop if the CRM provider cuts off access.
    procurement: true
  case-work:
    name: Case work
    short: Applications, case plans, deadlines, approvals
    what: >-
      The heart of the system, built on the CRM provider's SaaS product. Typically the product is broken up into packages, one per service category.
    does: >-
      It handles intake, case plans, court steps, work lists and legal deadlines. It
      also checks that a worker has the authority to make a decision on that date.
    why: >-
      This is where most of the building happens. No product comes prepackaged to model acts and regulations, bespoke business processes or domain specific rules, so the rules,
      deadlines and approval checks are custom work on any product.
    buildBuy:
      approach: buy
      label: >-
        Buy: the CRM provider's package, then configure
      summary: >-
        The CRM provider supplies generic record containers for benefits, care plans, providers and
        court steps. BC's specific policies and rules are built on top.
      options:
        - name: CRM package
          kind: buy
          note: >-
            Basic records and workflow. BC-specific work is built on top. The closer the CRM default is to existing models, the less customization work is needed.
    watch:
      tone: limit
      text: >-
        All programs share a single CRM, so they cannot be changed and released
        fully on their ownk, and program-level customizations are very limited.
    procurement: true
  rules:
    name: Rules
    short: Works out eligibility and amounts
    what: >-
      The CRM provider's rules engine. It holds every processing and evaluation rule, including eligibility, 
      how much they get, with the date each rule starts.
    does: >-
      It works out elements like eligibility and payment amounts and explains how it got there. Each
      result, with its inputs and the rule version used, is sent off the CRM platform as the
      record of the decision.
    why: >-
      Policy determines eligibility and entitlements deterministically - once the relevant facts are established, there is no room for human judgement.
      Workers evaluate claims and the submitted evidence and make determinations as to the sufficiency of this evidence. A rules engine ensures administrative fairness,
      improves processing speed and reliability, and enhances traceability and auditability.
    buildBuy:
      approach: platform
      label: >-
        Platform: part of the CRM licence
      summary: >-
        Most CRM vendors include some sort of business rules component or an integration with a common commercial tool (e.g. Camunda). 
      options:
        - name: CRM rules engine
          kind: buy
          note: >-
            Included. Monthly usage limit not confirmed by the CRM provider.
        - name: Separate rules service on CSBC servers
          kind: build
          note: Earlier projects developed a business rules management system, this could be quickly refactored for use.
    watch:
      tone: gap
      text: >-
        If the CRM provider cuts off access both the rules system and its inputs become unavailable. A self-hosted rules engine still depends on data collected by and held in the CRM.
  notices:
    name: Notices and documents
    short: Letters, forms and court papers
    what: >-
      Most CRM systems offer a document generator and management mechanism for letters, notifications etc.
    does: >-
      It produces each notice and keeps the finished copy as the record of what was
      sent. There are currently over 1,200 such documents or forms managed today.
    why: >-
      Document management is a significant portion of the labour effort in ICM today for both business and IT staff. Even small efficiencies here will pay dividends.
    buildBuy:
      approach: platform
      label: >-
        Platform: part of the CRM licence
      summary: >-
        Document creation is typically included with the CRM SaaS product, or an integration an integration with a leading commercial product (e.g. Adobe Experience Manager) is also available.
        Most CRM providers do not include an e-signature product - as this is not a requirement of any business process, it can be excluded.
      options:
        - name: CRM document generation
          kind: buy
          note: >-
            Typically included, where it is not, license with integrated provider is next-best alternative.
    watch:
      tone: limit
      text: >-
        Many CRM systems impose limits on the throughput of documents and have steep overage charges - or fractionally less steep subscriptions.
  platform-services:
    name: Platform services
    short: Security, privacy, backup add-ons
    what: >-
      Most CRMs have a long list of security, logging, instrumentation, privacy protection, encryption, and back-up addons. 
      These are often ignored or excluded from initial estimates. Additional add-ons include personal data request management, data redaction features, etc.
      Many CRM SaaS providers delegate these features to the extension marketplace. 
    does: >-
      They encrypt data, watch who opens what, keep field history for up to 10 years,
      and apply retention and deletion rules.
    why: >-
      Client and child protection records are among the most sensitive the province
      holds. These add-ons are how the CRM provider protects them and proves who saw them.
    buildBuy:
      approach: buy
      label: >-
        Buy: CRM add-ons
      summary: >-
        Each is a separate CRM product whose cost typically scales with the total size of the CRM rather than usage of the specific tool.
      options:
        - name: Security add-on
          kind: buy
          note: Encryption, access monitoring, field history.
        - name: Privacy add-on
          kind: buy
          note: Retention, deletion and privacy requests.
        - name: Test data masking add-on
          kind: buy
          note: Hides personal data in test copies.
        - name: Backup add-on
          kind: buy
          note: Backup and restore.
    watch:
      tone: limit
      text: >-
        By default, CRM SaaS products use a single site-wide encryption key - so crypto-shredding is impossible.
    procurement: true
  open-host:
    name: Service API
    short: One agreed way in and out
    what: >-
      A single API for other systems to talk to the case system, using the
      business's own words for things. It runs on the integration platform on CSBC servers.
    does: >-
      It brings decision records, evidence and payment requests out of the CRM platform to the
      CSBC-side parts. It sends payment status back in.
    why: >-
      Other systems connect to this API, not to the CRM platform's inner workings.
    buildBuy:
      approach: buy
      label: >-
        Buy: the integration platform, run on CSBC servers
      summary: >-
        Most CRM providers have a standard integration solution - either as a subsidiary or as a de facto standard. 
        This integration tool runs within CSBC servers. In most cases, licensing is either free (where open source) or a combination of capacity and consumption.
      options:
        - name: Integration platform
          kind: buy
          note: >-
            Run on CSBC servers, with the gateway managed by CSBC.
    procurement: true
  change-relay:
    name: Change feed
    short: Sends every CRM change out
    what: >-
      A feed that notices each change to records in the CRM platform and passes it on.
    does: >-
      It passes changes to the event stream on CSBC servers. From there they reach
      the backup copy and the analysis store.
    why: >-
      This is what keeps CSBC's backup copy current. Without it the backup would
      be out of date when it is needed most.
    buildBuy:
      approach: buy
      label: >-
        Buy: CRM add-on, carried by the integration platform
      summary: >-
        Most CRMs providers have a very basic built-in change-feed and sell a change-feed add-on or subscription with more data, higher limits.
        They are typically priced with a flat-fee plus a usage rate.
        The integration platform carries the changes to CSBC's servers.
      options:
        - name: >-
            CRM platform events and change data capture add-on
          kind: buy
          note: >-
            Most CRM providers have a low default limit, which must be raised through payment.
        - name: Integration platform
          kind: buy
          note: Carries the feed to CSBC servers.
    watch:
      tone: limit
      text: >-
        Most CRM platforms do not support durable event logs - with change feeds lasting a few days. 
        If connectivity to the change feed is lost for long periods, desyncronization between systems is possible, recovery is difficult and manual.
    procurement: true
  secure-exchange:
    name: APS P2P
    short: A secure data exchange among government organizations
    what: >-
      The connection to the province's APS P2P, this is an end-point for the integration platform.
    does: >-
      It provides a security server to enable connectivity to the APS P2P network for connected data.
    why: >-
      To ensure secure, privacy respecting and transparent data usage. A log of each
      exchange shows what data was shared, with whom and when.
    buildBuy:
      approach: platform
      label: >-
        Utilize the existing APS P2P platform security server pattern.
      summary: >-
        The CRM product cannot host the security server itself, so the integration platform acts as the conduit - 
        both client and server to the connected service network.
      options:
        - name: APS P2P
          kind: adopt
          note: Uses the APS P2P common component.
  financial-components:
    name: Financial components
    short: Debts, recovery and payment amounts
    what: >-
      The CSBC-built module that turns decisions and actions into accrual accounting events and transactions.
      It ocvers overpayments, repayable amounts, and can be expanded to capture flexible payment schedules and types. 
    does: >-
      It converts decisions made into accrual accounting events, works out overpayments, underpayments, receivables, establishes repayment plans, etc.
      It maintains the authoritative ledger and reconciles accounts based on transaction records return by payment providers.
    why: >-
      The current financial calculations and processings are embedded entirely within the mainframe system. 
      Managing the many edge-cases and regular irregularities of payments gracefully would bring tremendous productivity yields.
    buildBuy:
      approach: build
      label: >-
        Build: on the CSBC's own servers
      summary: >-
        Four successive research projects starting in 2022 through to 2026 have compared dozens of financial products.
        The recommendation of each such analysis was the same - build. This recommendation holds. 
      options:
        - name: Build
          kind: build
          note: Recommended direction.
        - name: Apache Fineract
          kind: open-source
          note: >-
            Top score, but brings its own client and loan model.
    watch:
      tone: fixed
      text: >-
        Pulling financial processing out of the CRM ensures total control over the highest risk component and prevents disruption caused by CRM updates.
  ledger:
    name: Ledger
    short: The money record, balanced every day
    what: >-
      The ledger is the authoritative account maintained by the financial components.
      It is compliant with established standards and ensures a rigorous, immutable log of all financial activity is kept and recoverable.
      Here it is an append-only table in a CSBC-managed database.
    does: >-
      It records every payment and recovery as balanced entries that can never be
      changed. It is checked against the bank and the government's accounts every day.
    why: >-
      Reconciliation is a scattershot and largely manual process today.
    buildBuy:
      approach: build
      label: >-
        Build: a locked table in CSBC's database
      summary: >-
        A test compared a plain table in the free PostgreSQL database with three
        leading ledger engines: TigerBeetle, Formance Ledger and Blnk Core. The
        plain table passed all nine tests and no engine did better, so the proposed
        direction is to build. TigerBeetle is the one to revisit if volumes outgrow one
        database.
      options:
        - name: Table in PostgreSQL
          kind: build
          note: >-
            Recommended. Passed all nine tests; one test run only.
        - name: TigerBeetle
          kind: open-source
          note: >-
            Fast, but needs a second store for details. Revisit if volumes grow.
        - name: Formance Ledger
          kind: commercially supported open-source
          note: >-
            Allowed details to be rewritten; kept deleted values.
        - name: Blnk Core
          kind: commercially supported open-source
          note: >-
            Allowed details to be rewritten; needs extra moving parts.
        - name: Apache Fineract
          kind: open-source
          note: Brings its own client and loan model.
    watch:
      tone: fixed
      text: >-
        The CRM-S route lacks a true ledger - which is a crucial element of financial management that costs the province thousands of labour-hours and millions of dollars.
  payments:
    name: Payments and benefit issuance
    short: The monthly payment run
    what: >-
      The one place payments leave CSBC. It runs on CSBC servers and makes
      the direct deposit and cheque files.
    does: >-
      It turns approved payment requests into files for the bank, BC Mail Plus and
      government accounts. It records what was paid, returned or rejected.
    why: >-
      The volume of low-value payments issued by the social sector vastly outstrips the processing capabilities and transaction limits of common government providers like CFS.
      Instead, all payment processing is currently handled by MIS, and this will be taken up in the modern system by a dedicated component.
      The sensitivity of this component is such that it must run on CSBC's servers.
    buildBuy:
      approach: build
      label: >-
        Build: on the CSBC's own servers
      summary: >-
        Research has examined 58 commercial payment hobs and providers, as well as open-source or self-hosted commercial payment management systems.
        Of the 58 commercial providers, 52 were subsidiaries of foreign financial institutions (USA, China, Ukraine, Luxembourg, and Curaçao.
        Of the Canadian options, the transparency and logging mechanism would almost certainly fall short of government accounting standards. 
        Thus, the proposed direction is to build, using an existing framework, a payment management utility that extends the financial components.  
      options:
        - name: Build
          kind: build
          note: Recommended direction.
        - name: Bottomline Payments Hub
          kind: buy
          note: Top score among commercial providers.
        - name: Kyriba Payments
          kind: buy
          note: Next-best.
        - name: moov-io/cadeft
          kind: open-source
          note: >-
            Library for direct deposit files; not mature.
        - name: Payment Hub EE and OpenG2P
          kind: open-source
          note: Designs to learn from, not to adopt.
    watch:
      tone: fixed
      text: >-
        The payment run is released on CSBC's own calendar, so it can be frozen
        around payment day. CRM-S cannot do this.
  decision-store:
    name: Decision record store
    short: Locked record of every decision
    what: >-
      A store on CSBC servers that keeps the full record of each decision. Records
      are linked in a chain, so any later change shows.
    does: >-
      It receives each decision's inputs, the rules version used, the step-by-step
      working and the outcome from the CRM platform. It keeps them for as long as required.
    why: >-
      When a client asks for a review or appeals, this record shows exactly what was
      decided and why and is instantly queryable and recoverable.
    buildBuy:
      approach: build
      label: >-
        Build: on the CSBC's own servers
      summary: >-
        There are numerous highly-specific ways this record must be stored, presented, secured, queryed and managed.
        No commercial product keeps decision records the way the social sector requires. 
      options:
        - name: Build
          kind: build
          note: Highest security, most ergonomic.
        - name: Keep the record inside the CRM platform
          kind: buy
          note: >-
            CRM provider has limitless and indefinite access to every record in the system.
    watch:
      tone: fixed
      text: >-
        Decision records are kept off the CRM platform in a chain that shows any change. Kept on the CRM, every record could captured, corrupted or tampered with at any time. 
  rules-archive:
    name: Rules snapshot archive
    short: A copy of every rules version
    what: >-
      A store on CSBC servers holding an exact copy of every version of the rules,
      made the moment it is switched on.
    does: >-
      Each copy gets a fingerprint. Each decision record carries the fingerprint of the
      rules it used.
    why: >-
      Years later, anyone can see the exact rule that applied to a client's decision. It
      does not matter whether the CRM platform still has it.
    buildBuy:
      approach: build
      label: >-
        Build: on the CSBC's own servers
      summary: >-
        The rules are exported from the CRM platform when each version is switched on and
        stored here. This is new work for this option.
      options:
        - name: Build
          kind: build
          note: >-
            Export, fingerprint and store each rules version.
    watch:
      tone: limit
      text: >-
        The copies are evidence only. They cannot run outside the CRM platform to make new
        decisions.
  drift-check:
    name: Drift check
    short: Catches rules changed in place
    what: >-
      A scheduled check that validates the rule base for currency, correctness and coherence.
    does: >-
      If there are issues with the rule base, it is rolled back to the last valid state and notifications raised. 
    why: >-
      Business rules changes (such as rate changes) can go-live accidentally, or changes can conflict with existing rules inadvertantly.
      This check ensures that rules changes never break the rule set and never go live accidentally.
    buildBuy:
      approach: build
      label: >-
        Build: a scheduled check
      summary: >-
        No reviewed CRM provider includes integrity or coherence checks as part of the rules platform - these would need to be developed.
      options:
        - name: Build
          kind: build
          note: Can be added to the rules archive
    watch:
      tone: limit
      text: >-
        It cannot actively block bad updates - administrators must remember to test the draft ruleset before deploying.
  evidence-store:
    name: Evidence and verification store
    short: Permanent record of claims, evidence and determinations.
    what: >-
      A store on CSBC servers that keeps every claim a client made, the evidence they provided to corroborate it, and the determination made by the worker about that claim.
      This record is immutable and append-only.
    does: >-
      It keeps a chronology of all submissions, assertions, evidence and facts, including corrections, redactions, and rescindments.
      It holds this for the full retention period.
    why: >-
      Evidence and claims are the constituent element of a client's submission, determinations are space for judgment on the part of the worker.
      Decision reviews, audits and tribunals are only as effective as the quality of the evidence they can review. A full history makes such review work straightforward.
    buildBuy:
      approach: build
      label: >-
        Build: on the event stream
      summary: >-
        Three rounds of research (2023, 2024, 2026) found no commercial product or mature open source project that captures the evidence record in a workable fashion.
        The recommendation is to adopt an open source event broker, and build the evidence store using that.
      options:
        - name: Build on Apache Kafka
          kind: build
          note: Recommended direction.
        - name: Evidence kept in the CRM platform
          kind: buy
          note: >-
            CRMs charge for storage usage and transfer bandwidth - evidence records typically include binary files like scanned documents or PDF documents.
            CRM providers cannot be reasonably expected to comply with the retention periods contemplated by CFD.
            CRM providers do not have the forensic capabilities to make this capability fully mature.
    watch:
      tone: fixed
      text: >-
        Fact records are maintained off the CRM platform as the permanent, immutable and authoritative history. 
        The CRM records are an ephemeral "working copy"
  kafka:
    name: Event stream (Kafka)
    short: Carries every change, in order
    what: >-
      Kafka is free software that works like a conveyor belt for events. Each change
      or decision goes on in order and stays there for as long as needed. A registry
      checks every event has the agreed shape.
    does: >-
      It carries changes from the CRM platform to the evidence store, backup copy and analysis
      store. Any part can replay past messages to rebuild its records.
    why: >-
      The CRM platform's own messages vanish after 72 hours. This stream keeps them, so a part
      that falls behind can catch up without losing anything, and system behaviour can be monitored effectively.
      Event-driven orchestration of services is the most sustainable and scalable way to offer a "ask once" connected service experience.
    buildBuy:
      approach: open-source
      label: >-
        Open source: Apache Kafka, run by CSBC
      summary: >-
        The recommendation is to either adopt Apache Kafka has a corporate common component (an enterprise needs only one Kafka instance),
        or barring that, use a light-weight event broker such as Red Panda or NATS.
      options:
        - name: Apache Kafka common component
          kind: open-source
          note: Recommended.
        - name: Apicurio Registry or Karapace
          kind: open-source
          note: >-
            Free schema registries
        - name: Confluent or Redpanda
          kind: buy
          note: Recommended only if use is limited to social sector.
        - name: NATS, Polars
          kind: open-source
          note: Lighter-weight alternatives to Kafka, recommended only if use is limited to social sector.
        - name: CRM event bus
          kind: buy
          note: Keeps messages only 72 hours.
    watch:
      tone: fixed
      text: >-
        Changes can be replayed long after 72 hours, in order. CRM-S cannot do
        this.
  continuity-copy:
    name: Continuity copy
    short: Live backup of the records
    what: >-
      A copy of the case records kept on CSBC servers. It is updated all the time
      while the CRM platform is running.
    does: >-
      It keeps the records current, so the fallback applications can run from it if
      the CRM platform is cut off.
    why: >-
      If the supplier ever cut off access, the ministry would still have its records.
    buildBuy:
      approach: build
      label: >-
        Build: on CSBC's own servers
      summary: >-
        CSBC requires a live, on-premise copy for any core product run by a
        supplier. The CRM platform's change feed fills it. The copy itself is built and run by
        CSBC.
      options:
        - name: Build, fed by the change feed
          kind: build
          note: >-
            Required by the programme's continuity direction.
        - name: Scheduled export
          kind: buy
          note: >-
            The all-CRM way. Older data, not a live copy.
    watch:
      tone: fixed
      text: >-
        The records stay current on CSBC servers if the CRM platform is cut off.
  fallback-apps:
    name: Fallback applications
    short: Keep going if the CRM platform is cut off
    what: >-
      Small applications on CSBC servers that run from the continuity copy.
    does: >-
      They let staff view cases and take new applications. They also run a payment that
      repeats last month's amounts through the same ledger checks.
    why: >-
      Clients would still be paid if the supplier cut off access. They would get the
      same amount as last time until the CRM platform came back.
    buildBuy:
      approach: build
      label: >-
        Build: on CSBC's own servers
      summary: >-
        The team builds a case viewer, intake and a repeat-payment run. No business area
        has yet said it needs more than repeating last month's payments.
      options:
        - name: Build
          kind: build
          note: Case viewer, intake and repeat payments.
        - name: Manual emergency payments
          kind: existing
          note: >-
            The all-CRM way, carried over from today's plan.
    watch:
      tone: fixed
      text: >-
        Payments can repeat last month's amounts if the CRM platform is cut off. New decisions
        and changes in amount would wait.
  lakehouse:
    name: Analysis store
    short: Reports without extra copies
    what: >-
      A store on CSBC servers for reports and analysis, fed from the event stream.
    does: >-
      It lets analysts and managers report on caseloads, payments and outcomes from the
      same records the system uses.
    why: >-
      Today reporting relies on a separate copy of the data. Each extra copy is another
      place personal information can leak or go out of date.
  reporting-line:
    name: Emergency & Reporting-line Backup Path
    short: Emergency & Child protection calls during outages
    what: >-
      A simple intake path on CSBC servers for emergency requests and the 24-hour child protection
      reporting line.
    does: >-
      It lets staff respond to a subset of issues and record reports of a child at risk when the CRM platform is unavailable. 
      The reports are correlated with their case files when connectivity is re-established.
    why: >-
      The director must receive and assess every report, day or night. CRM maintenance often falls at nights and weekends, when these lines are busiest.
    buildBuy:
      approach: build
      label: >-
        Build: on CSBC's own servers
      summary: >-
        The CRM provider cannot exempt one part of the system from its maintenance. A small
        separate path is built instead.
      options:
        - name: Build
          kind: build
          note: A small intake path off the CRM platform.
        - name: Paper or offline capture
          kind: existing
          note: Back-entered later.
    watch:
      tone: limit
      text: >-
        Only a basic intake path. The full reporting-line screens still follow
        the CRM provider's maintenance dates.
  government:
    name: Government and justice partners
    short: Canada Revenue Agency, courts, police and others
    what: >-
      Partners such as the Canada Revenue Agency, Service Canada, courts, police, Vital
      Statistics, Pacific Blue Cross and Indigenous authorities.
    does: >-
      They send and receive information, such as income checks and court orders, through
      the integration platform.
    why: >-
      Many decisions rely on facts from these partners. Getting the information quickly
      and safely means fewer delays and fewer errors for clients.
