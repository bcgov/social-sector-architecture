# The words on the timeline page.
#
# Edit the words freely. Keep the names before each colon (what:, does:, ...)
# and the indentation as they are. Lines under a ">-" are one paragraph:
# wrap them however you like. Save with: npm run copy:save -- "what you changed"

team:
  - role: Developers
    count: 6 to 9
    focus: >-
      Build, test and release the system. On the Salesforce plans they need Salesforce
      and MuleSoft skills. On the event-driven plan they need skills in the open-source
      parts and in recording facts with their dates.
  - role: UX designers
    count: 1 to 2
    focus: >-
      Design the screens and online forms. Test them with workers and clients, including
      people who use screen readers.
  - role: Service designer
    count: "1"
    focus: >-
      Map how the work really happens across workers, clients and partners. Plan how
      each program moves to the new system, one group at a time.
  - role: Product manager
    count: "1"
    focus: >-
      Decide what goes into each release and in what order. Keep the list of work tied
      to what workers and clients need most.
  - role: Director
    count: "1"
    focus: >-
      Lead the team. Get the funding, decisions and purchases each release needs, and
      report progress to ministry leaders.
plans:
  s:
    summary: >-
      A planning sketch, not a commitment. Everything moves onto Salesforce and runs the
      way ICM (today's case system) runs now. The first 7 months go to design work while
      Salesforce and MuleSoft licences are bought, because almost nothing can be built
      without them. After that, a release goes out every 3 months, one program at a
      time, from the smallest programs to child protection.
    firstValueMonth: 13
    totalMonths: 100
    realism: >-
      The research puts the Salesforce build at 19,385 person-days, its likely figure.
      This team can do about 2,640 person-days a year. 19,385 divided by 2,640 is 7.3
      years of build. Once the first release is live, the team must also retest the
      system before each of Salesforce's three upgrades a year, about 135 person-days a
      year. That adds about 4 months. With the 7-month wait for licences, the plan runs
      about 100 months, a little over 8 years. With 10 people it is closer to 10 years;
      with 14, about 7. The research's own range, 12,475 to 29,940 person-days, means
      anywhere from about 4 to 14 years of build. The estimate also leaves out project
      management, training, running ICM and Salesforce side by side, and contingency, so
      the real time will be longer. Two teams of this size could bring the whole plan
      down to roughly 4 and a half years, if the work splits cleanly between them. It
      rarely splits perfectly.
    assumptions:
      - Procurement lead times are planning assumptions, not figures from the research.
        We assume 4 to 9 months for a large competitive purchase, and 2 to 4 months when
        an existing agreement or standing offer can be used.
      - "We count the whole team of 12 as delivery capacity: 12 people times 220 working
        days is 2,640 person-days a year. That is generous, because the director and
        product manager will not build software."
      - Effort comes from the Salesforce research (19,385 person-days likely). It
        assumes a mixed team of Salesforce specialists, MuleSoft and data engineers, and
        testers. This team has no dedicated testers or MuleSoft engineers, so developers
        cover that work or the team hires for it.
      - The 7 months before building starts are spent on discovery, service design and a
        prototype on Salesforce's free trial systems, using made-up data only. That
        design work is not counted in the build estimate.
      - The ministry already runs Salesforce for its contract management system and some
        portals. Buying through that relationship might shorten the 7-month licence
        wait. Whether the new system shares that Salesforce setup or has its own is
        still an open question.
      - Licences for about 9,400 staff are listed at roughly 31 to 56 million US dollars
        a year before discounts. We assume they can be bought in steps as each program
        moves. Salesforce has not been asked.
      - "The order of programs follows the target architecture's rule: smallest set of
        rules and lowest harm first, employment assistance late, child protection last."
      - Before any program's decisions go live, Salesforce's answers are checked against
        ICM's for three monthly cycles, as the research assumes.
      - Payment work assumes the Comptroller General's office accepts a new ministry
        payment system. Provincial policy requires that, and nobody has asked yet. The
        bank's file format is also not confirmed.
      - Salesforce's limit on how often its rules engine can be called each month is not
        confirmed. A low limit could slow the side-by-side checks.
      - Child protection estimates have not had a second reader, so they may grow.
      - Moving onto Salesforce needs written exceptions to four requirements, including
        keeping payments going if the supplier cuts off access. This plan assumes those
        are approved before building starts.
    phases:
      - id: s-discover
        name: Discovery and design while licences are bought
        start: 0
        end: 7
        lane: foundation
        goal: >-
          Learn how the work is done today and design the first releases while
          procurement runs.
        releases: []
        blockedBy: []
      - id: s-found
        name: Set up Salesforce and the link to ICM
        start: 7
        end: 14
        lane: foundation
        goal: >-
          Set up Salesforce, its security and access rules, and the MuleSoft link that
          reads from and writes to ICM.
        releases: []
        blockedBy:
          - sf-core
          - sf-protect
          - mulesoft
      - id: s-view
        name: >-
          First release: a better worker view
        start: 9
        end: 16
        lane: release
        goal: >-
          Give workers a fast client search and a one-page case summary, read from ICM,
          without changing how cases are decided.
        releases:
          - month: 13
            name: Pilot in one office
            who: Workers in one office
            what: >-
              Search for a client and see a one-page summary of their cases. ICM stays
              the official record, so nothing done here can damage it.
          - month: 16
            name: All offices
            who: Workers in every office
            what: >-
              The same search and summary, with fixes from the pilot.
        blockedBy:
          - sf-core
          - sf-protect
          - mulesoft
      - id: s-small
        name: Two smaller programs first
        start: 15
        end: 36
        lane: release
        goal: >-
          Move child care subsidy and employment services first, because their rules are
          the smallest and a mistake does the least harm.
        releases:
          - month: 19
            name: Online application, one region
            who: >-
              New child care subsidy applicants in one region, and their workers
            what: >-
              Apply online and upload documents. Each application is copied into ICM, so
              nothing is lost.
          - month: 22
            name: Decisions and letters
            who: Child care subsidy workers
            what: >-
              Eligibility is worked out by rules kept in Salesforce, and the letter is
              made from the decision.
          - month: 25
            name: Existing cases move
            who: All child care subsidy clients and workers
            what: >-
              Open cases move from ICM in groups. A group can be moved back if something
              goes wrong.
          - month: 28
            name: Employment services referrals and plans
            who: >-
              Employment services workers and service providers
            what: >-
              Referrals and plans are made in Salesforce. Providers use a partner
              website.
          - month: 31
            name: Employment services cases move
            who: All employment services clients and workers
            what: Open cases move from ICM in groups.
          - month: 34
            name: Reviews and appeals
            who: >-
              Clients asking for a review, and the staff who handle it
            what: >-
              Requests to review a decision, and their legal deadlines, are handled in
              Salesforce for both programs.
        blockedBy:
          - sf-core
          - mulesoft
          - esign
          - scan-redact
          - sf-analytics
      - id: s-pay
        name: Payments and overpayments
        start: 33
        end: 48
        lane: release
        goal: >-
          Pay clients of the moved programs from Salesforce, with files sent to the
          bank, BC Mail Plus and the government's accounting system through MuleSoft.
        releases:
          - month: 40
            name: Side-by-side payment run
            who: Finance staff
            what: >-
              Salesforce works out each payment while the old system still pays. Staff
              compare the two each month. No money moves from Salesforce yet.
          - month: 43
            name: First live payment run
            who: >-
              Child care subsidy and employment services clients
            what: >-
              Payments for these two programs are issued from Salesforce.
          - month: 46
            name: Overpayments and debts
            who: Finance and recovery staff
            what: >-
              Overpayments and repayments are recorded in Salesforce. They are no longer
              printed, scanned and typed into another system.
        blockedBy:
          - sf-core
          - mulesoft
      - id: s-adult
        name: Disability assistance and employment assistance
        start: 46
        end: 74
        lane: release
        goal: >-
          Move the two largest programs together, late on purpose, because a wrong
          answer here can mean someone cannot buy food this month.
        releases:
          - month: 52
            name: Online monthly report, one region
            who: Employment assistance clients in one region
            what: >-
              Send the monthly report online. ICM still makes the decision.
          - month: 55
            name: Disability applications online
            who: >-
              People applying for disability assistance, and people helping them
            what: Apply online and see where the application is.
          - month: 58
            name: Side-by-side decisions
            who: Program staff
            what: >-
              Salesforce works out entitlement for real cases next to ICM for three
              monthly cycles. Every difference is explained before anyone relies on the
              new answer.
          - month: 61
            name: First region moves
            who: Clients and workers in one region
            what: >-
              Cases, decisions, letters and payments for both programs move to
              Salesforce together, because the disability decision sets the rate
              employment assistance pays.
          - month: 64
            name: Two more regions
            who: Clients and workers in two more regions
            what: The same move, with fixes from the first region.
          - month: 67
            name: Half the province
            who: Clients and workers in about half the province
            what: More regions move in groups.
          - month: 70
            name: Rest of the province
            who: >-
              All remaining clients and workers in both programs
            what: >-
              The rest of the caseload moves. ICM no longer handles these programs.
          - month: 73
            name: Old screens switched off
            who: Workers in both programs
            what: >-
              ICM screens and links for these programs are turned off.
        blockedBy:
          - sf-core
          - mulesoft
      - id: s-cp
        name: Child protection
        start: 68
        end: 96
        lane: release
        goal: >-
          Move child protection last, with its own design work, because it has the least
          structured practice, the strictest privacy needs and court-ordered records.
        releases:
          - month: 74
            name: Caregivers and providers
            who: >-
              Foster caregivers, service providers and the workers who support them
            what: >-
              Caregiver and provider records and licensing move to Salesforce, with a
              partner website.
          - month: 77
            name: Family plans and agreements
            who: Child protection workers
            what: >-
              Care plans and agreements with families are made and tracked in Salesforce.
          - month: 80
            name: Court documents
            who: Child protection workers who go to court
            what: >-
              Court proceedings and orders are tracked in Salesforce. About 150 forms
              and letters are made there.
          - month: 83
            name: Visits on mobile
            who: Workers visiting families in remote areas
            what: >-
              Record visits on a phone or tablet, even with no signal.
          - month: 86
            name: Reports of concern
            who: The 24/7 reporting line and intake workers
            what: >-
              Calls about a child's safety go straight into the case. A backup way to
              record reports is used during Salesforce's maintenance windows.
          - month: 89
            name: Investigations
            who: Child protection workers
            what: >-
              Investigations and safety assessments are done in Salesforce.
          - month: 92
            name: Adoption
            who: Adoption workers
            what: >-
              Adoption records move to Salesforce. This is the largest single piece of
              child protection work.
          - month: 95
            name: Remaining cases move
            who: All child protection workers
            what: >-
              The rest of the open child protection cases move from ICM in groups.
        blockedBy:
          - sf-core
          - mulesoft
          - sf-field
          - scan-redact
      - id: s-migrate
        name: Move the remaining history
        start: 88
        end: 98
        lane: migration
        goal: >-
          Move closed cases and old records out of ICM with their original dates, and
          check that every record arrived.
        releases:
          - month: 97
            name: History check complete
            who: Records staff and auditors
            what: >-
              Every old record is in Salesforce or in a checked archive, with its
              original dates.
        blockedBy:
          - sf-core
          - sf-protect
          - mulesoft
      - id: s-retire
        name: Switch off ICM
        start: 96
        end: 100
        lane: retire
        goal: >-
          Turn off ICM and the Siebel product it runs on, close its links to other
          systems, and keep a controlled archive.
        releases:
          - month: 100
            name: ICM switched off
            who: Everyone
            what: >-
              ICM is turned off. Its licence, support and servers stop costing money.
        blockedBy: []
    procurement:
      - id: sf-core
        item: >-
          Salesforce licences: the platform, Public Sector Solutions, the portal add-on
          (Experience Cloud) and 24/7 support
        why: >-
          Every Salesforce screen, form and record runs on these, for about 9,400 staff
          accounts. Published list prices come to roughly 31 to 56 million US dollars a
          year before discounts.
        leadMonths: 7
        blocks:
          - s-found
          - s-view
          - s-small
          - s-pay
          - s-adult
          - s-cp
          - s-migrate
        startBy: Month 0, the day the project starts
      - id: sf-protect
        item: >-
          Salesforce Shield, Privacy Center, Data Mask, Backup and Recover, extra
          storage and test copies (sandboxes)
        why: >-
          Needed before any real client data goes in. They give encryption, access
          monitoring, field history, deletion rules, test copies with no personal
          information, and backups.
        leadMonths: 7
        blocks:
          - s-found
          - s-view
          - s-migrate
        startBy: Month 0, with the main licences
      - id: mulesoft
        item: >-
          MuleSoft Anypoint Platform, run on the ministry's own servers, with its
          connector for ICM's Siebel product
        why: >-
          MuleSoft is Salesforce's tool for linking systems. It links Salesforce to ICM
          while both run, and to the bank, Treasury, BC Mail Plus, the Canada Revenue
          Agency, courts and others.
        leadMonths: 7
        blocks:
          - s-found
          - s-view
          - s-small
          - s-pay
          - s-adult
          - s-cp
          - s-migrate
        startBy: Month 0, the day the project starts
      - id: sf-analytics
        item: >-
          Reporting tools: CRM Analytics or Tableau
        why: >-
          Dashboards for workers and managers, and reports that replace today's data
          warehouse feeds as each program moves.
        leadMonths: 5
        blocks:
          - s-small
        startBy: By month 8
      - id: esign
        item: Electronic signature service
        why: >-
          Salesforce does not sell one. The ministry already uses DocuSign with its
          contract management system, so extending that contract may be quicker.
        leadMonths: 4
        blocks:
          - s-small
        startBy: By month 10
      - id: scan-redact
        item: >-
          Virus scanning for uploaded files and a document redaction tool, on the
          ministry's own servers
        why: >-
          Salesforce has no built-in scanning of uploads, and no tool for blacking out
          parts of a record before it is released.
        leadMonths: 5
        blocks:
          - s-small
          - s-cp
        startBy: By month 9
      - id: sf-field
        item: Salesforce Field Service and Service Cloud Voice
        why: >-
          Field Service lets child protection workers record visits on a phone or
          tablet, even offline. Voice connects calls to the 24/7 reporting line to the
          case.
        leadMonths: 6
        blocks:
          - s-cp
        startBy: By month 62
  h:
    summary: >-
      A planning sketch, not a commitment. Case work and rules move onto Salesforce.
      Money, evidence, decision records, the event stream and a backup copy of the
      records stay on the ministry's own servers. The ministry-side parts need no
      Salesforce licence, so the team starts building them during the licence wait.
      Releases then go out every 3 months, one program at a time, as in the
      all-Salesforce plan.
    firstValueMonth: 13
    totalMonths: 120
    realism: >-
      The research puts the Salesforce side at 22,185 person-days, its likely figure. It
      does not estimate the parts on the ministry's own servers. Other research gives a
      rough floor for some of them: event stream and evidence store 1,040, payment run
      800, ledger 240, and matching accounts with the bank 200. That makes 2,280, and
      the total at least 24,465. Retesting before Salesforce's three upgrades a year
      adds about 1,200 over 9 years. At 2,640 person-days a year, that is 9.7 years of
      work. About 750 person-days get done during the licence wait, so the plan runs
      about 120 months, or 10 years. It is still missing the decision record store, the
      backup copy and its fallback tools, and a backup path for the reporting line, so
      it will run longer. With 10 people it is about 12 years; with 14, about 8 and a
      half. Two teams of this size could bring it to roughly 5 and a half years if the
      work splits cleanly.
    assumptions:
      - Procurement lead times are planning assumptions, not figures from the research.
        We assume 4 to 9 months for a large competitive purchase, and 2 to 4 months when
        an existing agreement or standing offer can be used.
      - "We count the whole team of 12 as delivery capacity: 12 people times 220 working
        days is 2,640 person-days a year. That is generous, because the director and
        product manager will not build software."
      - Salesforce-side effort comes from the Salesforce research (22,185 person-days
        likely). The ministry-side floor comes from rough rules of thumb in the
        technology and payments research. Those researchers call their figures a floor.
      - In months 2 to 7, part of the team builds the ministry-side parts (about 750
        person-days) while others do discovery and service design.
      - The ministry-side parts run on the government's own private cloud. That is an
        existing service, not a purchase. The event stream software is free, but who
        supports it on that platform is not confirmed in writing.
      - The ministry already runs Salesforce for its contract management system and some
        portals. Buying through that relationship might shorten the 7-month licence
        wait.
      - Licences for about 9,400 staff are listed at roughly 31 to 56 million US dollars
        a year before discounts. We assume they can be bought in steps. Salesforce has
        not been asked.
      - The backup copy only needs to repeat last month's payments if Salesforce cuts
        off access. No business area has asked for more. If more services must keep
        running, this plan grows.
      - Payment work assumes the Comptroller General's office accepts a new ministry
        payment system, as provincial policy requires. The bank's file format is also
        not confirmed.
      - "The order of programs follows the target architecture: smallest set of rules
        and lowest harm first, employment assistance late, child protection last."
      - Salesforce's monthly limit on rules engine calls is not confirmed. A low limit
        could slow the side-by-side checks.
      - Child protection estimates have not had a second reader, so they may grow.
