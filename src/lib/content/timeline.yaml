    procurement:
      - id: sf-core
        item: >-
          Salesforce licences: the platform, Public Sector Solutions, the portal add-on
          (Experience Cloud) and 24/7 support
        why: >-
          Every Salesforce screen, form and record runs on these, for about 9,400 staff
          accounts. Published list prices come to roughly 31 to 56 million US dollars a
          year before discounts.
        leadMonths: 7
        blocks:
          - h-found
          - h-view
          - h-small
          - h-adult
          - h-cp
          - h-migrate
        startBy: Month 0, the day the project starts
      - id: sf-protect
        item: >-
          Salesforce Shield, Privacy Center, Data Mask, Backup and Recover, extra
          storage and test copies (sandboxes)
        why: >-
          Needed before any real client data goes in. They give encryption, access
          monitoring, field history, deletion rules, test copies with no personal
          information, and backups.
        leadMonths: 7
        blocks:
          - h-found
          - h-view
          - h-migrate
        startBy: Month 0, with the main licences
      - id: mulesoft
        item: >-
          MuleSoft Anypoint Platform, run on the ministry's own servers, with its
          connector for ICM's Siebel product
        why: >-
          MuleSoft is Salesforce's tool for linking systems. Here it links Salesforce to
          ICM, to the ministry-side parts, and to the bank, Treasury, courts and others.
        leadMonths: 7
        blocks:
          - h-found
          - h-view
          - h-small
          - h-pay
          - h-adult
          - h-cp
          - h-migrate
        startBy: Month 0, the day the project starts
      - id: kafka-support
        item: >-
          Support contract for the event stream software (Apache Kafka), only if the
          government's private cloud team cannot support it
        why: >-
          The event stream carries every fact and decision between Salesforce and the
          ministry-side parts. The software is free, but someone must be on call when it
          breaks.
        leadMonths: 4
        blocks:
          - h-small
        startBy: Month 1
      - id: sf-analytics
        item: >-
          Reporting tools: CRM Analytics or Tableau
        why: >-
          Dashboards for workers and managers, and reports that replace today's data
          warehouse feeds as each program moves.
        leadMonths: 5
        blocks:
          - h-small
        startBy: By month 9
      - id: esign
        item: Electronic signature service
        why: >-
          Salesforce does not sell one. The ministry already uses DocuSign with its
          contract management system, so extending that contract may be quicker.
        leadMonths: 4
        blocks:
          - h-small
        startBy: By month 11
      - id: scan-redact
        item: >-
          Virus scanning for uploaded files and a document redaction tool, on the
          ministry's own servers
        why: >-
          Salesforce has no built-in scanning of uploads, and no tool for blacking out
          parts of a record before it is released.
        leadMonths: 5
        blocks:
          - h-small
          - h-cp
        startBy: By month 10
      - id: recon
        item: >-
          Account matching (reconciliation) product, only if the ministry decides to buy
          rather than build
        why: >-
          Matches the ministry's ledger with the bank and the government's accounts
          every day. It is the one payments part where buying is plausible. A request
          for information is drafted but not sent.
        leadMonths: 6
        blocks:
          - h-pay
        startBy: By month 28
      - id: sf-field
        item: Salesforce Field Service and Service Cloud Voice
        why: >-
          Field Service lets child protection workers record visits on a phone or
          tablet, even offline. Voice connects calls to the 24/7 reporting line to the
          case.
        leadMonths: 6
        blocks:
          - h-cp
        startBy: By month 74
  e:
    summary: >-
      A planning sketch, not a commitment. The ministry builds its own target design in
      parts, using free open-source software and services the government already runs,
      and buys only a few common tools. With no big licence to wait for, a first worker
      release can come in month 9. Releases then go out every 3 months, and each part of
      ICM is switched off as its replacement lands.
    firstValueMonth: 9
    totalMonths: 106
    realism: >-
      No one has made a bottom-up estimate for this option, so we built one. The
      technology and payments research gives a floor for the ten main parts: 13,040
      person-days. That floor leaves out child protection, moving data and links to
      other organizations. For those we borrowed the Salesforce research's figures as
      stand-ins: child protection 6,495, moving data 1,330, links 1,140 and running
      beside ICM 930. The total is 22,935. At 2,640 person-days a year that is 8.7
      years. Starting after 2 months of discovery, the plan runs about 106 months. With
      10 people it is about 10 and a half years; with 14, about 7 and a half. This is
      the least certain of the three figures. The target architecture's own costing for
      the full design is 142 to 249 million dollars over 9 to 13 years, with 55 to 110
      people. At its own rates that is roughly 350 to 960 person-years of work, because
      it also counts project management, training, running two systems side by side and
      contingency. At 12 people that would take 30 to 80 years. So one team this size
      cannot deliver the full design. It can deliver the first parts and prove the
      approach. The full design needs several teams, with child protection run by its
      own team from the start, as the architecture intends.
    assumptions:
      - Procurement lead times are planning assumptions, not figures from the research.
        We assume 4 to 9 months for a large competitive purchase, and 2 to 4 months when
        an existing agreement or standing offer can be used.
      - "We count the whole team of 12 as delivery capacity: 12 people times 220 working
        days is 2,640 person-days a year. That is generous, because the director and
        product manager will not build software."
      - Effort is built from rough rules of thumb in the technology and payments
        research, which the authors call a floor, plus figures borrowed from the
        Salesforce research for the parts the floor leaves out. Treat it as a low
        estimate.
      - This plan moves a thin, read-only worker view ahead of the full shared
        foundations. The target architecture's own order builds all foundations first
        and puts the first visible release at 18 to 27 months. Only read-only pieces can
        safely move earlier, because they cannot damage ICM's records.
      - The first release reads a copy of changes from ICM's database. Oracle's written
        position on doing that continuously from the live database is needed first.
      - Free software runs on the government's own private cloud, an existing service.
        The event stream software (Kafka) is not yet on that platform's supported list.
        We assume the platform team supports the pilot, and that support is confirmed in
        writing before the new system becomes the official record for anything.
      - Changes inside ICM must go through the team that configures it, on its monthly
        release cycle. Its time must be booked ahead.
      - "The order of programs follows the target architecture: smallest set of rules
        and lowest harm first, employment assistance late, child protection last."
      - Payment work assumes the Comptroller General's office accepts a new ministry
        payment system, as provincial policy requires. The bank's file format is also
        not confirmed.
      - Payments for a program go live only after side-by-side runs show zero difference
        for three monthly cycles, as the architecture requires.
      - The team needs skills it may not have, such as recording facts with several
        dates and running the event stream. The architecture names the first as the
        biggest skills gap in the program.
      - Child protection estimates have not had a second reader, so they may grow.
    phases:
      - id: e-discover
        name: Discovery and setup
        start: 0
        end: 3
        lane: foundation
        goal: >-
          Learn how the work is done today, and set up hosting on the government's own
          private cloud.
        releases: []
        blockedBy: []
      - id: e-found
        name: Shared foundations, built in thin layers
        start: 2
        end: 16
        lane: foundation
        goal: >-
          Build only the shared parts the next release needs: the event stream, the
          evidence store, the ministry's own data rules for other systems, and the link
          layer to ICM.
        releases: []
        blockedBy: []
      - id: e-view
        name: >-
          First release: a better worker view
        start: 4
        end: 15
        lane: release
        goal: >-
          Give workers a fast client search and one summary across programs, without
          writing anything back to ICM.
        releases:
          - month: 9
            name: Pilot in one office
            who: Workers in one office
            what: >-
              Search for a client and see one summary across programs. It reads a copy
              of ICM's changes and writes nothing, so it cannot damage ICM's records.
          - month: 12
            name: All offices
            who: Workers in every office
            what: >-
              The same search and summary, with fixes from the pilot.
          - month: 15
            name: Duplicate review
            who: Workers and records staff
            what: >-
              Likely duplicate client records are flagged for a person to decide. Merges
              are recorded so they can be undone.
        blockedBy: []
      - id: e-notices
        name: Letters and notices
        start: 14
        end: 30
        lane: release
        goal: >-
          Make letters in the new system, tie each one to its decision, and switch off
          ICM's letters. This is the first part of ICM to be retired.
        releases:
          - month: 18
            name: Letters for one program
            who: Clients and workers in one small program
            what: >-
              Letters come from the new system, each tied to the decision it reports,
              with the right appeal wording.
          - month: 21
            name: Letters for all programs
            who: All clients and workers
            what: >-
              Every program's letters come from the new system.
          - month: 24
            name: ICM letters switched off
            who: All workers
            what: >-
              ICM's letter function is turned off and its links closed.
          - month: 27
            name: Proof of delivery
            who: Workers and clients
            what: >-
              Workers can see when each letter was sent and whether it arrived.
        blockedBy:
          - kafka-support
      - id: e-docs
        name: Documents and online applications
        start: 28
        end: 44
        lane: release
        goal: >-
          Move documents, signatures and new applications to the new system. Existing
          cases stay in ICM for now.
        releases:
          - month: 31
            name: Upload and sign online
            who: Clients and workers
            what: >-
              Clients upload documents and sign forms online. Workers see them on the
              case.
          - month: 34
            name: Online application, child care subsidy
            who: New child care subsidy applicants
            what: >-
              New applications start in the new system and are copied into ICM. Existing
              cases are not touched.
          - month: 37
            name: Online applications for all programs
            who: New applicants in every program
            what: Every new application starts in the new system.
          - month: 40
            name: ICM documents switched off
            who: All workers
            what: >-
              ICM's document storage is turned off and its links closed.
          - month: 43
            name: Move-back tested
            who: Program staff
            what: >-
              A group of applications is moved back to ICM and forward again for real,
              to prove it can be done if something goes wrong.
        blockedBy:
          - esign
          - capture
      - id: e-work
        name: Work queues
        start: 42
        end: 52
        lane: release
        goal: >-
          Build one set of work queues for every program, so workers see all their tasks
          and deadlines in one place.
        releases:
          - month: 46
            name: Work queues, one office
            who: Workers and supervisors in one office
            what: >-
              Tasks, caseloads and overdue items are managed in the new system.
          - month: 49
            name: Work queues everywhere
            who: Workers and supervisors in every office
            what: The same, in every office.
          - month: 52
            name: ICM queues switched off
            who: All workers
            what: >-
              ICM's task and queue functions are turned off. Task times must be no
              slower than before.
        blockedBy: []
      - id: e-rules
        name: Decisions for the two smaller programs
        start: 50
        end: 70
        lane: release
        goal: >-
          Build the ministry's rules tools and decision records, then move child care
          subsidy and employment services decisions, smallest first.
        releases:
          - month: 55
            name: Side-by-side, child care subsidy
            who: Program staff
            what: >-
              The new rules work out child care subsidy for real cases next to ICM for
              three monthly cycles. Every difference is explained.
          - month: 58
            name: Child care subsidy decisions live
            who: Child care subsidy clients and workers
            what: >-
              Decisions are made in the new system, each with a full record of its facts
              and rules.
          - month: 61
            name: Side-by-side, employment services
            who: Program staff
            what: >-
              The same three-cycle check for employment services.
          - month: 64
            name: Employment services decisions live
            who: Employment services clients and workers
            what: Decisions are made in the new system.
          - month: 67
            name: Old rules switched off
            who: Program staff
            what: >-
              ICM's decision paths for both programs are turned off.
        blockedBy:
          - rules-quote
      - id: e-pay
        name: Payments and overpayments
        start: 64
        end: 82
        lane: release
        goal: >-
          Pay clients of the moved programs through one payment service with its own
          ledger, matched every day to the bank and the government's accounts.
        releases:
          - month: 70
            name: Side-by-side payment runs
            who: Finance staff
            what: >-
              The new payment run works out each payment next to the old one. It must
              match to the cent for three monthly cycles.
          - month: 73
            name: First live payment run
            who: >-
              Child care subsidy and employment services clients
            what: >-
              Payments for these two programs come from the new system.
          - month: 76
            name: Overpayments and debts
            who: Finance and recovery staff
            what: >-
              Overpayments are raised, repaid, written off or sent to collections in the
              new system.
          - month: 79
            name: Emergency payments tested
            who: Finance and operations staff
            what: >-
              The emergency payment path is run for real in a test, not just written
              down.
          - month: 82
            name: Old payment path switched off
            who: Finance staff
            what: >-
              The old payment path for these programs is turned off.
        blockedBy:
          - recon
      - id: e-appeals
        name: Reviews and appeals
        start: 78
        end: 86
        lane: release
        goal: >-
          Handle reviews and appeals once, for every program, with their legal deadlines.
        releases:
          - month: 84
            name: Reviews and appeals
            who: >-
              Clients asking for a review, and the staff who handle it
            what: >-
              Reviews and appeals run in the new system for every program moved so far.
              A successful appeal is paid through the same payment service.
        blockedBy: []
      - id: e-adult
        name: Disability assistance and employment assistance
        start: 84
        end: 104
        lane: release
        goal: >-
          Move the two largest programs together, last among the adult programs, because
          a wrong answer here can mean someone cannot buy food this month.
        releases:
          - month: 87
            name: Side-by-side decisions
            who: Program staff
            what: >-
              The new rules work out disability and employment assistance for real cases
              next to ICM for three monthly cycles.
          - month: 90
            name: First region moves
            who: Clients and workers in one region
            what: >-
              Decisions and payments for both programs move together, because the
              disability decision sets the rate employment assistance pays.
          - month: 93
            name: More regions
            who: Clients and workers in more regions
            what: More regions move in groups.
          - month: 96
            name: Half the province
            who: Clients and workers in about half the province
            what: More regions move in groups.
          - month: 99
            name: Rest of the province
            who: >-
              All remaining clients and workers in both programs
            what: The rest of the caseload moves.
          - month: 102
            name: Old decision paths switched off
            who: Program staff
            what: >-
              ICM's decision paths for both programs are turned off.
        blockedBy: []
      - id: e-cp
        name: Child protection
        start: 80
        end: 104
        lane: release
        goal: >-
          Move child protection last, with its own design work and permission to build
          rather than configure, because it has the least structured practice and the
          strictest privacy needs.
        releases:
          - month: 85
            name: Caregivers and providers
            who: >-
              Foster caregivers, service providers and the workers who support them
            what: >-
              Caregiver and provider records move to the new system.
          - month: 88
            name: Family plans and agreements
            who: Child protection workers
            what: >-
              Care plans and agreements with families are made and tracked in the new
              system.
          - month: 91
            name: Court documents
            who: Child protection workers who go to court
            what: >-
              Court proceedings, orders and their documents are tracked in the new
              system.
          - month: 94
            name: Reports of concern
            who: The 24/7 reporting line and intake workers
            what: >-
              Calls about a child's safety go straight into the case, on the ministry's
              own release calendar.
          - month: 97
            name: Investigations
            who: Child protection workers
            what: >-
              Investigations and safety assessments are done in the new system.
          - month: 100
            name: Adoption
            who: Adoption workers
            what: Adoption records move to the new system.
          - month: 103
            name: Remaining cases move
            who: All child protection workers
            what: >-
              The rest of the open child protection cases move from ICM in groups.
        blockedBy: []
      - id: e-migrate
        name: Move the remaining history
        start: 96
        end: 104
        lane: migration
        goal: >-
          Move closed cases and old records out of ICM with their original dates, and
          check that every record arrived.
        releases:
          - month: 103
            name: History check complete
            who: Records staff and auditors
            what: >-
              Every old record is in the new system or in a checked archive, with its
              original dates.
        blockedBy: []
      - id: e-retire
        name: Switch off ICM
        start: 102
        end: 106
        lane: retire
        goal: >-
          Turn off what is left of ICM and the Siebel product it runs on, close its last
          links, and keep a controlled archive.
        releases:
          - month: 106
            name: ICM switched off
            who: Everyone
            what: >-
              ICM is turned off. Its licence, support and servers stop costing money.
        blockedBy: []
    procurement:
      - id: kafka-support
        item: >-
          Support contract for the event stream software (Apache Kafka), only if the
